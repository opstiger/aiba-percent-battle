<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Character Lab · 下一代球员模型</title>
<!-- 下一代球员模型的独立展示页（不接主链路）。左：游戏里现在的模型（原始 voxelGuy + applyStarStyle
     + 新球鞋 + 角色着色，和游戏里看到的一致）；右：src/lab/character-next.js 的新模型。
     同一套摄影棚灯光、环境反射、软阴影地台。
     URL：?star=j23&pose=release&view=both|next|current&angle=front|three-quarter|side|back|head&spin=1&nohud=1 -->
<style>
  :root{--bg:#0e1117;--panel:rgba(16,19,26,.82);--line:rgba(255,255,255,.08);--text:#e9edf3;--dim:#8d97a6;--accent:#ffb547}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}
  #stage{position:fixed;inset:0}
  .tag{position:fixed;top:18px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600;letter-spacing:.02em;pointer-events:none}
  .tag small{color:var(--dim);font-weight:500;margin-left:6px}
  #tagL{left:calc(28% - 90px)} #tagR{left:calc(72% - 90px)}
  body[data-view="next"] #tagL,body[data-view="current"] #tagR{display:none}
  body[data-view="next"] #tagR,body[data-view="current"] #tagL{left:50%;transform:translateX(-50%)}
  #ui{position:fixed;left:16px;bottom:16px;width:min(360px,calc(100vw - 32px));padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px)}
  #ui h1{font-size:14px;margin-bottom:2px} #ui p{color:var(--dim);font-size:12px;margin-bottom:10px}
  .row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .row label{width:100%;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  button,select{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);border-radius:8px;padding:5px 10px;font:inherit;cursor:pointer}
  button.on{border-color:var(--accent);color:var(--accent);background:rgba(255,181,71,.08)}
  select{width:100%}
  body[data-hud="0"] #ui,body[data-hud="0"] .tag{display:none}
  @media (max-width:640px){#tagL{left:16px}#tagR{left:auto;right:16px}}
</style>
<body data-view="both" data-hud="1">
<div id="stage"></div>
<div class="tag" id="tagL">现在<small>游戏内模型</small></div>
<div class="tag" id="tagR">下一代<small>character-next</small></div>
<div id="ui">
  <h1>下一代球员模型</h1>
  <p>8 头身比例 · 截面放样塑形 · 雕刻头部 · PBR 服装。拖动旋转。</p>
  <div class="row"><label>球星</label><select id="star"></select></div>
  <div class="row" id="poses"><label>姿势</label></div>
  <div class="row" id="angles"><label>机位</label></div>
  <div class="row" id="views"><label>显示</label></div>
</div>

<script src="vendor/three.min.r128.js"></script>
<script>
/* 与 viewer.html 同一套前置：materials.js 加载时就要 renderer / V3 */
window.renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,preserveDrawingBuffer:true});
window.V3=function(x,y,z){return new THREE.Vector3(x,y,z);};
window.G=window.G||{};
</script>
<script src="src/core/runtime.js"></script>
<script src="src/config.js"></script>
<script src="src/assets-manifest.js"></script>
<script src="src/rendering/materials.js"></script>
<script src="src/rendering/model-detail.js"></script>
<script src="src/rendering/shoe-last.js"></script>
<script src="src/rendering/retro-high.js"></script>
<script src="src/rendering/shoe-styles.js"></script>
<script src="src/rendering/basketball-shoes.js"></script>
<script src="src/rendering/shoe-colorways.js"></script>
<script src="src/rendering/player-kit.js"></script>
<script src="src/rendering/character-shading.js"></script>
<script src="src/rendering/characters.js"></script>
<script src="src/lab/character-next.js"></script>
<script>
(function(){
"use strict";
const Q=new URLSearchParams(location.search);
const state={star:Q.get("star")||"j23",pose:Q.get("pose")||"stand",view:Q.get("view")||"both",angle:Q.get("angle")||"three-quarter",spin:Q.get("spin")==="1",yaw:0};
document.body.dataset.view=state.view;
document.body.dataset.hud=Q.get("nohud")==="1"?"0":"1";

/* ---------- 渲染器 / 场景 ---------- */
renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.physicallyCorrectLights=false;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById("stage").appendChild(renderer.domElement);
const scene=new THREE.Scene();window.scene=scene;
scene.background=new THREE.Color(0x0e1117);
scene.fog=new THREE.Fog(0x0e1117,9,22);
const camera=new THREE.PerspectiveCamera(30,1,.05,60);

/* 摄影棚环境反射：一间暗房 + 几块发光灯箱，PMREM 卷积后给 PBR 材质当环境 */
(function(){
  const env=new THREE.Scene();
  const room=new THREE.Mesh(new THREE.BoxGeometry(20,10,20),new THREE.MeshBasicMaterial({color:0x151922,side:THREE.BackSide}));env.add(room);
  const panel=(w,h,x,y,z,ry,c)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:c,side:THREE.DoubleSide}));m.position.set(x,y,z);m.rotation.y=ry;env.add(m);};
  panel(6,2.2,-5,4,4,Math.PI*.7,0xfff1dc);   // 主光灯箱
  panel(4,1.6,6,3,2,-Math.PI*.6,0xbcd4ff);   // 冷色补光
  panel(8,1,0,4.9,-6,0,0xffffff);            // 背后条灯
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshBasicMaterial({color:0x2a2622}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;env.add(floor);
  const pm=new THREE.PMREMGenerator(renderer);
  scene.environment=pm.fromScene(env,.02).texture;
})();

/* 三点布光 */
scene.add(new THREE.HemisphereLight(0xbfd1ff,0x2a2018,.45));
const key=new THREE.DirectionalLight(0xfff0dd,2.1);key.position.set(-3.2,5.2,4.2);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-3;key.shadow.camera.right=3;key.shadow.camera.top=3.2;key.shadow.camera.bottom=-.5;
key.shadow.bias=-.0004;key.shadow.normalBias=.02;key.shadow.radius=4;scene.add(key);
const rimL=new THREE.DirectionalLight(0x9fc4ff,1.35);rimL.position.set(3.5,3.2,-4.5);scene.add(rimL);
const fill=new THREE.DirectionalLight(0xffe2c4,.35);fill.position.set(4,1.4,3);scene.add(fill);

/* 地台 */
// 低机位看台面是掠射角，菲涅尔会把环境里的白灯箱整片反上来（首版台面发白），环境反射压低
const stageMat=new THREE.MeshStandardMaterial({color:0x1a1d24,roughness:.86,metalness:0,envMapIntensity:.06});stageMat.color.convertSRGBToLinear();
const disc=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.7,.06,64),stageMat);disc.position.y=-.03;disc.receiveShadow=true;scene.add(disc);
const ring=new THREE.Mesh(new THREE.TorusGeometry(2.6,.008,6,96),new THREE.MeshBasicMaterial({color:0xffb547}));ring.rotation.x=Math.PI/2;ring.position.y=.002;scene.add(ring);

/* ---------- 球星 ---------- */
const CFG=window.AIBA_CONFIG||{};
const STARS=(CFG.CLASSIC_LEGENDS||[]).concat((window.AIBA_ASSETS&&AIBA_ASSETS.coverStars)||[]);
const LAST={j23:"Jordan",curry:"Curry",h13:"Harden",thompson:"Thompson",allen:"Allen",bird:"Bird",miller:"Miller",lillard:"Lillard",korver:"Korver",
  stojakovic:"Stojakovic",ionescu:"Ionescu",taurasi:"Taurasi","sue-bird":"Bird",k24:"Bryant",t01:"McGrady",v15:"Carter",a03:"Iverson",nova24:"Nova"};
const sel=document.getElementById("star");
STARS.forEach(s=>{const o=document.createElement("option");o.value=s.id;o.textContent=s.n||s.id;sel.appendChild(o);});
sel.value=state.star;

let current=null,next=null,ballNext=null;
/* 篮球：颗粒皮面 + 8 条黑缝（赤道、经线、两条弧形侧缝），颜色转线性 */
let _ballMat=null;
function ballMaterial(){
  if(_ballMat)return _ballMat;
  const c=document.createElement("canvas");c.width=1024;c.height=512;const g=c.getContext("2d");
  g.fillStyle="#c4561f";g.fillRect(0,0,1024,512);
  for(let i=0;i<26000;i++){const x=Math.random()*1024,y=Math.random()*512;g.fillStyle=Math.random()<.5?"rgba(90,30,8,.28)":"rgba(255,170,110,.16)";g.fillRect(x,y,1.6,1.6);}
  g.strokeStyle="#1a1210";g.lineWidth=7;g.lineCap="round";
  g.beginPath();g.moveTo(0,256);g.lineTo(1024,256);g.stroke();
  for(const u of [256,768]){g.beginPath();g.moveTo(u,0);g.lineTo(u,512);g.stroke();}
  for(const u0 of [0,512,1024]){g.beginPath();for(let y=0;y<=512;y+=4){const t=y/512*Math.PI;const x=u0+Math.sin(t)*150*(u0===512?1:u0===0?1:-1);y?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();}
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;
  _ballMat=new THREE.MeshStandardMaterial({map:t,roughness:.72,metalness:0,envMapIntensity:.4});
  return _ballMat;
}
const holder=new THREE.Group();scene.add(holder);
function starById(id){return STARS.find(s=>s.id===id)||STARS[0];}

function buildCurrent(star){
  const guy=voxelGuy();
  try{applyStarStyle(guy,star);}catch(e){console.warn("applyStarStyle",e);try{dressGuy(guy,star.col[0],star.col[1],String(star.num));}catch(e2){}}
  try{
    if(window.AIBAShoeColorways&&window.AIBABasketballShoes){
      AIBABasketballShoes.clear(guy);
      AIBABasketballShoes.apply(guy,"RetroHigh",{length:.44,...AIBAShoeColorways.forStar(star)});
    }
  }catch(e){console.warn("shoes",e);}
  try{if(typeof poseGuy==="function"&&typeof shotCurves==="function")poseGuy(guy,shotCurves(0),0);}catch(e){}
  return guy;
}
function rebuild(){
  holder.clear();
  const star=Object.assign({},starById(state.star));
  star.last=LAST[star.id]||(star.n||"").split("·").pop();
  current=buildCurrent(star);
  next=AIBACharacterNext.build(star);
  // 篮球：真实尺寸（直径 24cm），游戏里的球放大过 1.33 倍
  ballNext=new THREE.Mesh(new THREE.SphereGeometry(.16,48,32),ballMaterial());
  ballNext.scale.setScalar(.12/.16);ballNext.castShadow=true;
  next.root.add(ballNext);
  const both=state.view==="both";
  current.g.position.x=both?-.8:0;next.root.position.x=both?.8:0;
  current.g.visible=state.view!=="next";next.root.visible=state.view!=="current";
  holder.add(current.g);holder.add(next.root);
  applyPose();
}
const tmp=new THREE.Vector3();
function placeBall(){
  if(!next||!ballNext)return;
  const mode=next.ballMode;
  if(next.ikMode&&next.holdBall)next.holdBall(next.ikMode,.12);
  ballNext.visible=mode&&mode!=="gone"&&mode!=="none";
  if(!ballNext.visible)return;
  next.root.updateMatrixWorld(true);
  if(next.holdBall&&(mode==="set"||mode==="hip")){const c=next.holdBall(mode,.12);if(c){ballNext.position.copy(c);return;}}
  const hand=next.rig.arms[0].hand,guide=next.rig.arms[1].hand;
  const a=hand.localToWorld(new THREE.Vector3(0,-.07,.07)),b=guide.localToWorld(new THREE.Vector3(0,-.07,.07));
  // 出手瞬间：球刚离开指尖，贴在指腹前方
  let p=mode==="release"?hand.localToWorld(new THREE.Vector3(0,-.15,.14)):a.clone().lerp(b,.5);
  next.root.worldToLocal(p);ballNext.position.copy(p);
}
function applyPose(){
  if(!next)return;
  next.setPose(state.pose,1);
  placeBall();
}

/* ---------- 机位 ---------- */
const ANGLES={"front":0,"three-quarter":-.62,"side":-Math.PI/2,"back":Math.PI,"head":-.45};
function frame(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;
  const both=state.view==="both",head=state.angle==="head";
  const fov=head?18:30;camera.fov=fov;camera.updateProjectionMatrix();
  const air=state.pose==="release"||state.pose==="hold"||state.pose==="set";   // 举手 / 起跳的姿势整体更高，机位跟着抬
  const targetY=head?1.72:air?1.3:1.02,dist=head?(both?3.4:1.6):(both?6.6:4.6)*Math.max(1,1.1/Math.min(1.1,camera.aspect));
  const yaw=(ANGLES[state.angle]||0)+state.yaw;
  camera.position.set(Math.sin(yaw)*dist,targetY+(head?.02:.25),Math.cos(yaw)*dist);
  camera.lookAt(0,targetY,0);
}

/* ---------- UI ---------- */
function chips(id,items,cur,onPick){
  const el=document.getElementById(id);el.querySelectorAll("button").forEach(b=>b.remove());
  items.forEach(([v,label])=>{const b=document.createElement("button");b.textContent=label;if(v===cur)b.className="on";b.onclick=()=>onPick(v);el.appendChild(b);});
}
function ui(){
  chips("poses",[["stand","站姿"],["threat","三威胁"],["set","举球"],["release","出手"],["hold","随挥定格"]],state.pose,v=>{state.pose=v;applyPose();frame();ui();sync();});
  chips("angles",[["front","正面"],["three-quarter","3/4"],["side","侧面"],["back","背面"],["head","头部"]],state.angle,v=>{state.angle=v;state.yaw=0;frame();ui();sync();});
  chips("views",[["both","对比"],["next","只看新"],["current","只看旧"],["spin",state.spin?"转台 ●":"转台"]],state.view,v=>{
    if(v==="spin"){state.spin=!state.spin;}else{state.view=v;document.body.dataset.view=v;rebuild();frame();}
    ui();sync();});
}
function sync(){const q=new URLSearchParams(location.search);q.set("star",state.star);q.set("pose",state.pose);q.set("view",state.view);q.set("angle",state.angle);history.replaceState(null,"","?"+q);}
sel.onchange=()=>{state.star=sel.value;rebuild();sync();};
let drag=null;
renderer.domElement.addEventListener("pointerdown",e=>{drag=e.clientX;});
addEventListener("pointerup",()=>{drag=null;});
addEventListener("pointermove",e=>{if(drag==null)return;state.yaw+=(e.clientX-drag)*.008;drag=e.clientX;frame();});
addEventListener("resize",frame);

rebuild();ui();frame();
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,clock.getDelta());
  if(state.spin){holder.rotation.y+=dt*.35;}
  if(window.AIBABasketballShoes&&AIBABasketballShoes.updateAll)try{AIBABasketballShoes.updateAll(dt);}catch(e){}
  renderer.render(scene,camera);
}
loop();
window.__lab={state,rebuild,frame,applyPose,get next(){return next;},get current(){return current;},render:()=>renderer.render(scene,camera)};
})();
</script>
</body>
</html>
