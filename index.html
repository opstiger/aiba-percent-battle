<div id="bootLoad" role="dialog" aria-modal="true" aria-busy="true" aria-label="游戏资源加载" tabindex="0">
  <div class="bootFrame">
    <div class="bootBrand"><span>ai</span>BA</div>
    <div class="bootEdition">MODULAR / v2.19.8</div>
    <div class="bootRule"></div>
    <div id="bootStatus" class="bootStatus">正在展开赛场</div>
    <div class="bootMeter" aria-hidden="true"><i id="bootBar"></i></div>
    <div class="bootMeta"><span id="bootPercent">0%</span><span id="bootFile">初始化资源</span></div>
    <div id="bootStart" class="bootStart">画面与声音已待命<b>点击任意位置或按任意键</b></div>
  </div>
</div>

<div id="hud">
  <div id="hudRound" class="px"></div>
  <div id="hudTimer">70.0</div>
  <div id="hudScore"><div class="big" id="scoreNum">0</div><div class="sm">得分 PTS</div></div>
  <div id="hudRack"><div id="hudRackName"></div><div id="hudDots"></div></div>
  <div id="hudStreak">🔥 x0</div>
  <div id="powerWrap"><div id="pZone"><div id="pTag">甜区</div></div><div id="pSweet"></div><div id="pFill"></div></div>
  <div id="playerPower" aria-hidden="true">
    <svg viewBox="0 0 78 124" role="presentation">
      <defs>
        <linearGradient id="ppGrad" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#2e8bff"/><stop offset="55%" stop-color="#39d3ff"/><stop offset="78%" stop-color="#ffd23f"/><stop offset="100%" stop-color="#ff4040"/></linearGradient>
        <clipPath id="ppFillClip"><rect id="ppFillClipRect" x="0" y="124" width="78" height="0"/></clipPath>
      </defs>
      <path class="ppTrack" d="M30 112 C67 88 72 36 46 12" pathLength="100"/>
      <path class="ppSweet" d="M30 112 C67 88 72 36 46 12" pathLength="100"/>
      <g clip-path="url(#ppFillClip)">
        <path class="ppFill" d="M30 112 C67 88 72 36 46 12" pathLength="100"/>
      </g>
      <path class="ppRim" d="M22 115 C60 89 66 36 40 9"/>
    </svg>
  </div>
  <div id="tiltWrap"><span id="tiltLbl">⟺ 保持水平</span><div id="tiltCenter"></div><div id="tiltDot"></div></div>
  <div id="battleControls">
    <div id="battleSpotName">弧顶<br><span id="battleOppScore">对手 0/100</span></div>
  </div>
  <div id="battleScore">
    <span id="bsMe"><b id="bsMeName">你</b> <span id="bsMeNum">0</span></span>
    <span id="bsVS">VS</span>
    <span id="bsOpp"><span id="bsOppNum">0</span> <b id="bsOppName">对手</b></span>
    <div id="bsRace"><i id="bsRaceMe"></i><i id="bsRaceOpp"></i></div>
    <small id="bsTimer">0:00.0</small>
  </div>
  <button id="midBtn" onpointerdown="event.stopPropagation();event.preventDefault();battleSetSpot(7)" onclick="event.stopPropagation();event.preventDefault()">🔥 中场10分</button>
  <div id="edgeArrows"></div>
  <div id="spotDots"></div>
  <div id="courtTools" aria-label="球场工具">
    <button id="camBtn" type="button" data-aiba-icon="camera" data-aiba-label="第一人称" onclick="cycleCam()">第一人称</button>
    <button id="muteBtn" class="needsAudio" type="button" data-aiba-icon="volume-1" data-aiba-label="启动声音" onclick="toggleMute()">启动声音</button>
    <button id="pauseBtn" type="button" data-aiba-icon="pause" data-aiba-label="暂停菜单" onclick="openPauseMenu(event)">暂停菜单</button>
  </div>
  <div id="heroTag" data-aiba-icon="clapperboard" data-aiba-label="英雄时刻 HERO BALL">英雄时刻 HERO BALL</div>
  <div id="hudTarget"></div>
  <div id="vsBanner"></div>
  <div id="hint">按住屏幕蓄力 · 松开出手 · 停在绿色甜区</div>
</div>

<aside id="visionPreview" data-phase="align" aria-label="体感投篮摄像头预览">
  <div class="visionHead"><span><b>●</b> LOCAL POSE</span><button class="visionClose" type="button" aria-label="关闭体感控制" onclick="disableVisionControl(event)">×</button></div>
  <div class="visionBody"><div class="visionStage"><video id="visionVideo" muted playsinline></video><canvas id="visionCanvas"></canvas><div class="visionScan"></div></div><div class="visionTrack" aria-hidden="true"><i id="visionTrackFill"></i></div></div>
  <div class="visionFoot"><span id="visionState">等待启动</span></div>
</aside>

<div id="toast" class="px"></div>
<div id="pops"></div>
<div id="countN"></div>
<div id="finalRun" role="status" aria-live="assertive"><div class="finalRunCopy"><small>MATCH POINT PHASE</small><b>FINAL RUN</b><span>最后冲刺</span></div></div>

<div id="lbT"></div><div id="lbB"></div>
<div id="repUI">
  <div id="repTag">● REPLAY 精彩回放</div>
  <div id="repCam" data-aiba-icon="video" data-aiba-label="机位 1 · 侧翼跟踪">机位 1 · 侧翼跟踪</div>
  <button id="repSkip" class="btn sm" onclick="skipReplay()">跳过 ≫</button>
</div>

<div id="showUI">
  <span style="color:#ff4040;font-weight:bold">● LIVE</span>
  <b id="showName"></b>
  <span id="showScore" style="color:#ffd23f;font-size:20px;font-weight:bold">0</span>分
  <span id="showTgt" style="color:#9ab;font-size:11px"></span>
  <button class="btn sm" onclick="skipShow()" style="pointer-events:auto">跳过 ≫</button>
</div>
