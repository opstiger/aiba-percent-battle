<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Kobe 角色实验室</title>
<!-- 独立实验页，不接游戏主链路。
     一份角色定义（骨架 + 有符号距离场 SDF + 上色函数），四种渲染：
       A 体素 2cm   B 体素 1.2cm   C 3D→像素化（卡渲 + 同色系描边）   D 平滑雕塑（参照）
     URL: ?mode=v20|v12|pix|smooth|all &pose=idle|hold|fade &cam=front|tq|side|back|face -->
<style>
  :root{--panel:rgba(18,19,23,.84);--line:rgba(255,255,255,.09);--text:#eceae6;--dim:#8e8a84;--accent:#f2b02a;--purple:#8a5cc7}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    background:radial-gradient(ellipse 70% 60% at 50% 42%,#3a3a3f 0%,#232327 48%,#141417 100%)}
  canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  #labels .lab{position:fixed;padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:12px;pointer-events:none;white-space:nowrap}
  #labels .lab small{color:var(--dim);font-weight:500;margin-left:6px}
  #ui{position:fixed;left:16px;top:16px;width:min(300px,calc(100vw - 32px));padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);max-height:calc(100vh - 32px);overflow:auto}
  #ui h1{font-size:14px;letter-spacing:.02em}
  #ui p.sub{color:var(--dim);font-size:12px;margin:2px 0 10px}
  .row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
  .row>label{width:100%;color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em}
  button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);border-radius:8px;padding:4px 9px;font:inherit;font-size:12px;cursor:pointer}
  button:hover{background:rgba(255,255,255,.08)}
  button.on{border-color:var(--accent);color:var(--accent);background:rgba(242,176,42,.09)}
  input[type=range]{width:100%;accent-color:var(--accent)}
  #note{color:var(--dim);font-size:11.5px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
  #stat{font-variant-numeric:tabular-nums;color:var(--dim);font-size:11px;margin-top:6px}
  #busy{position:fixed;right:18px;bottom:18px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12px;opacity:0;transition:opacity .15s}
  body.busy #busy{opacity:1}
  #hide{position:fixed;right:16px;top:16px}
  body.nohud #ui,body.nohud #labels,body.nohud #busy,body.nohud #hide{display:none}
  #court{display:none}
  body.court #court{display:block}
  body.court .row:not(.cOnly):not(#rScene),body.court #labels{display:none}
  .cOnly{display:none}body.court .cOnly{display:flex}
  #cScore{position:fixed;right:20px;top:60px;padding:8px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:13px}
  #cScore b{font-size:22px;color:var(--accent)}#cScore small{color:var(--dim);margin-left:6px}
  #cHint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:6px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;color:var(--dim);white-space:nowrap}
  #cToast{position:fixed;left:50%;top:18%;transform:translate(-50%,0);font-size:34px;font-weight:800;letter-spacing:.04em;opacity:0;text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none}
  #cToast.show{animation:toast 1.3s ease-out}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,10px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1.06)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
  #cBar{position:fixed;right:34px;top:50%;transform:translateY(-50%);width:16px;height:260px;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid var(--line);overflow:hidden}
  #cZone{position:absolute;left:0;right:0;background:rgba(242,176,42,.22)}
  #cSweet{position:absolute;left:0;right:0;background:rgba(255,214,90,.75)}
  #cFill{position:absolute;left:3px;right:3px;bottom:0;border-radius:6px;background:linear-gradient(#fff,#cfd6e2);mix-blend-mode:screen}
  @media (max-width:640px){#ui{top:auto;bottom:16px;max-height:46vh}}
</style>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<button id="hide" title="隐藏面板 (H)">面板</button>
<div id="ui">
  <h1>Kobe #24 · 角色实验室 <small style="font-size:10.5px;color:var(--accent);font-weight:normal">v2.8 真耳朵/后脑/灰调浅寸头/头+15%/短脖</small></h1>
  <p class="sub">同一份角色定义，五种渲染。拖动旋转，滚轮缩放，双击复位。</p>
  <div class="row" id="rScene"><label>场景</label></div>
  <div class="row cOnly" id="rStyle"><label>球员风格</label></div>
  <div class="row cOnly" id="rDiff"><label>难度（AIBA）</label></div>
  <div class="row cOnly" id="rCCam"><label>机位</label></div>
  <div class="row" id="rMode"><label>渲染</label></div>
  <div class="row" id="rPose"><label>姿势</label></div>
  <div class="row" id="rAnim"><label>投篮动画 <span id="animv"></span></label><input id="aScrub" type="range" min="0" max="1" step="0.001" value="0"></div>
  <div class="row" id="rCam"><label>机位</label></div>
  <div class="row" id="rSleeve"><label>右臂护套</label></div>
  <div class="row" id="rPix"><label>像素颗粒 <span id="pixv"></span></label><input id="pix" type="range" min="2" max="10" step="1" value="4"></div>
  <div id="note"></div>
  <div id="stat"></div>
</div>
<div id="busy">构建中…</div>
<div id="court"><div id="cScore"></div><div id="cToast"></div><div id="cHint"></div>
  <div id="cBar"><div id="cZone"></div><div id="cSweet"></div><div id="cFill"></div></div></div>
<script src="../../vendor/three.min.r128.js"></script>
<script id="core">
"use strict";
const T=THREE;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const smin=(a,b,k)=>{const h=Math.max(k-Math.abs(a-b),0)/k;return Math.min(a,b)-h*h*k*.25;};

/* =====================================================================
   1. 骨架（静止姿态 = 世界坐标，角色面朝 +Z，左手 = +X）
   身高 1.98m，8.6 头身；臂展约 2.1m。
   ===================================================================== */
const BN=[],BI={};
function bone(name,parent,head){BI[name]=BN.length;BN.push({name,parent:parent==null?-1:BI[parent],head});}
bone('pelvis',null,[0,1.02,0]);
bone('spine','pelvis',[0,1.12,0]);
bone('chest','spine',[0,1.32,0]);
bone('neck','chest',[0,1.64,-.02]);
bone('head','neck',[0,1.72,-.02]);
for(const [sd,s] of [['L',1],['R',-1]]){
  bone('upperArm'+sd,'chest',[s*.195,1.60,-.01]);
  bone('foreArm'+sd,'upperArm'+sd,[s*.215,1.28,-.02]);
  bone('hand'+sd,'foreArm'+sd,[s*.228,.99,0]);
}
for(const [sd,s] of [['L',1],['R',-1]]){
  bone('thigh'+sd,'pelvis',[s*.095,1.0,0]);
  bone('shin'+sd,'thigh'+sd,[s*.1,.55,.01]);
  bone('foot'+sd,'shin'+sd,[s*.105,.09,-.01]);
}
bone('ball',null,[0,0,0]);
const NB=BN.length,INV=new Float64Array(NB*12),DM=BN.map(()=>new T.Matrix4());

/* =====================================================================
   2. 原语：椭球 / 圆锥胶囊 / 圆角盒 / 平面裁切
   op: 'u' 平滑并  's' 平滑差  'i' 硬交（裁切）
   ===================================================================== */
function prep(P){
  if(P.t===0){[P.cx,P.cy,P.cz]=P.c;[P.rx,P.ry,P.rz]=P.r;P.bc=P.c;P.br=Math.max(...P.r);}
  else if(P.t===1){
    [P.ax,P.ay,P.az]=P.a;P.bax=P.b[0]-P.a[0];P.bay=P.b[1]-P.a[1];P.baz=P.b[2]-P.a[2];
    P.l2=P.bax*P.bax+P.bay*P.bay+P.baz*P.baz;P.rr=P.r1-P.r2;P.a2=P.l2-P.rr*P.rr;P.il2=1/P.l2;
    P.bc=[(P.a[0]+P.b[0])/2,(P.a[1]+P.b[1])/2,(P.a[2]+P.b[2])/2];P.br=Math.sqrt(P.l2)/2+Math.max(P.r1,P.r2);
  }else if(P.t===2){[P.cx,P.cy,P.cz]=P.c;[P.hx,P.hy,P.hz]=P.h;P.bc=P.c;P.br=Math.hypot(...P.h)+P.rr;}
  else if(P.t===3){const l=Math.hypot(...P.n);[P.nx,P.ny,P.nz]=P.n.map(v=>v/l);}
  if(P.clip)[P.qx,P.qy,P.qz,P.qo]=P.clip;   // 逐原语裁切平面（该原语自己的骨骼空间）
  P.wc=[0,0,0];return P;
}
function primD(P,x,y,z){
  switch(P.t){
    case 0:{
      const X=(x-P.cx)/P.rx,Y=(y-P.cy)/P.ry,Z=(z-P.cz)/P.rz,k0=Math.sqrt(X*X+Y*Y+Z*Z);
      const X2=X/P.rx,Y2=Y/P.ry,Z2=Z/P.rz,k1=Math.sqrt(X2*X2+Y2*Y2+Z2*Z2);
      return k1<1e-9?-Math.min(P.rx,P.ry,P.rz):k0*(k0-1)/k1;
    }
    case 1:{
      const px=x-P.ax,py=y-P.ay,pz=z-P.az,bx=P.bax,by=P.bay,bz=P.baz,l2=P.l2,rr=P.rr,a2=P.a2,il2=P.il2;
      const Y=px*bx+py*by+pz*bz,Z=Y-l2,qx=px*l2-bx*Y,qy=py*l2-by*Y,qz=pz*l2-bz*Y;
      const x2=qx*qx+qy*qy+qz*qz,y2=Y*Y*l2,z2=Z*Z*l2,k=Math.sign(rr)*rr*rr*x2;
      if(Math.sign(Z)*a2*z2>k)return Math.sqrt(x2+z2)*il2-P.r2;
      if(Math.sign(Y)*a2*y2<k)return Math.sqrt(x2+y2)*il2-P.r1;
      return (Math.sqrt(x2*a2*il2)+Y*rr)*il2-P.r1;
    }
    case 2:{
      const qx=Math.abs(x-P.cx)-P.hx+P.rr,qy=Math.abs(y-P.cy)-P.hy+P.rr,qz=Math.abs(z-P.cz)-P.hz+P.rr;
      const mx=Math.max(qx,0),my=Math.max(qy,0),mz=Math.max(qz,0);
      return Math.sqrt(mx*mx+my*my+mz*mz)+Math.min(Math.max(qx,qy,qz),0)-P.rr;
    }
    case 3:return P.nx*x+P.ny*y+P.nz*z-P.off;
  }
}

/* =====================================================================
   3. 配色 & 小工具
   ===================================================================== */
const C={
  skin:0x6b3e28,skinLo:0x5a3322,palm:0x93634e,lip:0x4b271e,lipUp:0x3e2019,mouth:0x241009,lid:0x24140d,
  hair:0x5c4336,beard:0x2b1c15,brow:0x150e0a,iris:0x160d08,sclera:0x9c8c7d,
  gold:0xf7a912,purple:0x552583,white:0xf1efea,black:0x18181b,
  sole:0x4a2378,ballO:0xc4581d,seam:0x1d1511,tape:0xece7dc,nbaR:0xc8102e,nbaB:0x1d428a
};
/* hair：肤色 0x6b3e28 与暖灰 0x4d4844 各半——光头寸，只比皮肤暗一点、偏灰 */
for(const k in C)if(typeof C[k]!=='number')throw new Error('配色缺失: '+k);
const MAT={skin:0,cloth:1,satin:2,shoe:3,hair:4,eye:5,ball:6};
function hash3(i,j,k){let h=(i*374761393+j*668265263+k*2147483647)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,y,z,f){ // 低频值噪声（皮肤肤色起伏）
  x/=f;y/=f;z/=f;const i=Math.floor(x),j=Math.floor(y),k=Math.floor(z),u=x-i,v=y-j,w=z-k;
  const s=t=>t*t*(3-2*t),U=s(u),V=s(v),W=s(w);let r=0;
  for(let a=0;a<2;a++)for(let b=0;b<2;b++)for(let c=0;c<2;c++)r+=hash3(i+a,j+b,k+c)*(a?U:1-U)*(b?V:1-V)*(c?W:1-W);
  return r;
}
function lerpTab(t,tab){if(t<=tab[0][0])return tab[0][1];for(let i=1;i<tab.length;i++)if(t<=tab[i][0]){const [a,va]=tab[i-1],[b,vb]=tab[i];return va+(vb-va)*(t-a)/(b-a);}return tab[tab.length-1][1];}
const OUT={hex:0,m:0,mul:1};
const set=(hex,m,mul=1)=>{OUT.hex=hex;OUT.m=m;OUT.mul=mul;return OUT;};
let FS=.012; // 当前上色分辨率——细节带宽至少一格，避免粗网格下五官忽有忽无
const band=(v,c,w)=>Math.abs(v-c)<Math.max(w,FS)/2;

/* 贴花：像素数据由主线程用 canvas 画好再装进来（Worker 里没有 DOM） */
let JF=null,JB=null,SW=null;
function decalFrom(w,h,d){return (u,v)=>{const x=Math.floor(u*w),y=Math.floor(v*h);if(x<0||y<0||x>=w||y>=h)return -1;const i=(y*w+x)*4;if(d[i+3]<128)return -1;return(d[i]<<16)|(d[i+1]<<8)|d[i+2];};}
function installDecals(D){JF=decalFrom(D.JF.w,D.JF.h,D.JF.d);JB=decalFrom(D.JB.w,D.JB.h,D.JB.d);SW=decalFrom(D.SW.w,D.SW.h,D.SW.d);}

/* =====================================================================
   4. 分层建模：皮肤 / 球衣 / 短裤 / 袜 / 鞋 / 护臂 / 胶布 / 球
   ===================================================================== */
let OPT={sleeve:'black'};
/* 头部比例：五官和上色都在原来的"设计空间"里写，建模时整体放大 HS、再下移 HDY。
   放大支点在下颌附近（HP），所以头往上、往两侧长，不往脖子里长；下移让脖子变短。 */
const HS=1.15,HP=[0,1.74,0],HDY=-.036;
const headPt=d=>[d[0]*HS,HP[1]+(d[1]-HP[1])*HS+HDY,HP[2]+(d[2]-HP[2])*HS];              // 设计 → 静止
const headDesign=(x,y,z)=>[x/HS,HP[1]+(y-HDY-HP[1])/HS,HP[2]+(z-HP[2])/HS];              // 静止 → 设计
const EYE_Y=headPt([0,1.866,0])[1];   // 眼睛那一行在静止空间的高度（体素头部网格按它对齐）
function headXform(P){
  if(P.c)P.c=headPt(P.c);if(P.a)P.a=headPt(P.a);if(P.b&&P.t===1)P.b=headPt(P.b);
  if(P.r)P.r=P.r.map(v=>v*HS);if(P.h)P.h=P.h.map(v=>v*HS);
  for(const k of ['r1','r2','rr','k'])if(P[k]!=null)P[k]*=HS;
  return prep(P);
}
let LAYERS=[];
/* ---------- 手：掌心有弧度 + 四指三节 + 拇指三段 + 自动贴球 ----------
   参考 AIBA motion.js 的手部做法：
   · 手指分 MCP/PIP/DIP 三节，弯曲按 .18/.52/.30 分到三节（FINGER_BEND_PROFILE）；
   · 持球时指缝张开，食指、小指外张最多（SHOOT_FINGER_SPLAY 的思路，幅度按大手放大）；
   · 球落在指根肉垫 + 指腹上，掌心留空（ballGrip 在掌心前方偏指根）；
   · 出手后手指各弯各的：食指最直指向篮筐，中指/无名指收（HAND_FINGER_FOLLOW）。
   掌心弧度来自三块肉垫（大鱼际、小鱼际、指根垫）围出的凹陷，加上指根的横弓（食指、小指的
   指根比中指更靠掌心一侧）。
   静止姿态里（hand 骨骼空间）：指尖朝 -Y，掌心法线 N0=(-s,0,0)，拇指在 +Z 一侧。 */
const FINGER={y:[.893,.888,.891,.898],z:[.029,.0095,-.0095,-.028],arch:[.004,0,.002,.006],
  L:[[.041,.025,.020],[.045,.028,.021],[.042,.027,.020],[.033,.020,.017]],r:[.0104,.0108,.0102,.0091]};   // 科比手大、指节粗
const THUMB={L:[.036,.031,.025],r:[.013,.011,.0092]};
const BEND=[.18,.52,.30],TBEND=[.2,.45,.35];
const HAND_DEF={c:[.35,.42,.5,.56],sp:[.05,.01,-.02,-.06],to:.15,ta:0,tc:.3,grip:0};
let HANDS=null;   // {L,R}：每只手解好的指节角度（主线程算好，Worker 直接用）
function handSpec(h){return Object.assign({},HAND_DEF,h||{});}
function mixHand(a,b,e){const A=handSpec(a),B=handSpec(b),m=(x,y)=>x+(y-x)*e;
  return {c:A.c.map((v,i)=>m(v,B.c[i])),sp:A.sp.map((v,i)=>m(v,B.sp[i])),to:m(A.to,B.to),ta:m(A.ta,B.ta),tc:m(A.tc,B.tc),grip:m(A.grip,B.grip)};}
function chainPts(P0,d0,n0,lens,angs){ // 每节在 (d0,n0) 平面内向 n0 累积弯曲
  const pts=[P0];let th=0,P=P0;
  for(let j=0;j<lens.length;j++){th+=angs[j];const c=Math.cos(th),sn=Math.sin(th);
    P=[P[0]+(d0[0]*c+n0[0]*sn)*lens[j],P[1]+(d0[1]*c+n0[1]*sn)*lens[j],P[2]+(d0[2]*c+n0[2]*sn)*lens[j]];pts.push(P);}
  return pts;
}
/* 逐节弯到"指腹刚好贴住球面"：每节在上一节的基础上找第一个贴球角度；够不着就按自由手型弯 */
function hugAngles(P0,d0,n0,lens,rads,ball,free){
  const out=[];let th=0,P=P0;
  for(let j=0;j<lens.length;j++){
    const R=BALL_R+rads[j]*.8,l=lens[j];
    const g=t=>{const c=Math.cos(t),sn=Math.sin(t);
      const x=P[0]+(d0[0]*c+n0[0]*sn)*l-ball[0],y=P[1]+(d0[1]*c+n0[1]*sn)*l-ball[1],z=P[2]+(d0[2]*c+n0[2]*sn)*l-ball[2];
      return Math.sqrt(x*x+y*y+z*z)-R;};
    const bis=(a,b)=>{let ga=g(a);for(let k=0;k<24;k++){const m=(a+b)/2,gm=g(m);if((gm>0)===(ga>0)){a=m;ga=gm;}else b=m;}return (a+b)/2;};
    let t=null;
    if(g(th)<=0){const lo=th-.6;t=g(lo)>0?bis(lo,th):lo;}      // 已经顶进球里：往回伸直到刚好贴住
    else for(let a=th;a<th+1.5;a+=.08)if(g(a+.08)<=0){t=bis(a,a+.08);break;}
    if(t===null)t=th+free[j];
    t=Math.min(t,th+1.35);out.push(t-th);th=t;
    const c=Math.cos(th),sn=Math.sin(th);P=[P[0]+(d0[0]*c+n0[0]*sn)*l,P[1]+(d0[1]*c+n0[1]*sn)*l,P[2]+(d0[2]*c+n0[2]*sn)*l];
  }
  return out;
}
/* 解一只手：返回四指 + 拇指的起点/方向/各节角度。ball：球心在该手静止空间的坐标（可空） */
function solveHand(s,h,ball){
  h=handSpec(h);const N0=[-s,0,0],res={f:[],t:null};
  const palmC=[s*.226,.93,.004];
  const near=ball&&h.grip>.001&&Math.hypot(ball[0]-palmC[0],ball[1]-palmC[1],ball[2]-palmC[2])<BALL_R+.075;
  for(let i=0;i<4;i++){
    const sp=h.sp[i],d0=[0,-Math.cos(sp),Math.sin(sp)],K=[s*(.232-FINGER.arch[i]),FINGER.y[i],FINGER.z[i]];
    const free=BEND.map(b=>b*h.c[i]);let a=free;

function skinColor(tag,x,y,z,P){
  if(tag==='head')return headColor(x,y,z);
  if(tag==='ear'){const [dx,dy,dz]=headDesign(x,y,z),q=Math.hypot((Math.abs(dx)-.096)/.008,(dy-1.852)/.014,(dz+.009)/.011);

    const side=(x-P.pa[0])*P.pn[0]+(y-P.pa[1])*P.pn[1]+(z-P.pa[2])*P.pn[2];
    if(side>.0045)return set(C.palm,MAT.skin,.97);
    if(P.tip&&t>.45&&side<-.003)return set(0x9c7563,MAT.skin);            // 指甲

/* 头：头骨自己的静止空间网格。x 格界对称，眼睛那一行正好落在格中心 */
function voxelHead(s){
  let mn=[9,9,9],mx=[-9,-9,-9];
  for(const ly of LAYERS)for(const P of ly.prims)if(P.bone===HB&&P.op==='u')for(let a=0;a<3;a++){mn[a]=Math.min(mn[a],P.bc[a]-P.br);mx[a]=Math.max(mx[a],P.bc[a]+P.br);}

}
/* ---------- 平滑网格：Surface Nets，纯数组输出（主线程和 Worker 共用） ----------
   filter/M/bb 与 voxelize 同义：头部单独在头骨局部空间用更细的网格（五官细节 1~2mm，7.5mm 网格会糊）。
   法线取顶点所在格子 8 个角点的差分——不再每个顶点额外求 6 次场，D 版逐帧烘焙才跑得动。 */
function smoothData(s,filter,M,bb){
  FS=M?.003:.006;PF=filter||null;CM=M?M.elements.slice():null;const {mn,mx}=bb||bounds();
  const o=mn.map(v=>v-2*s),n=[0,1,2].map(a=>Math.ceil((mx[a]-mn[a])/s)+5);
  const f=sampleGrid(o,s,n),[nx,ny,nz]=n,id=(i,j,k)=>i+nx*(j+ny*k);
  const cell=new Int32Array(nx*ny*nz).fill(-1),pos=[],gr=[];
  const E=[[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]];
  const g=new Float32Array(8);
  for(let k=0;k<nz-1;k++)for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){
    let m=0;for(let c=0;c<8;c++){g[c]=f[id(i+(c&1),j+((c>>1)&1),k+((c>>2)&1))];if(g[c]<0)m|=1<<c;}
    if(m===0||m===255)continue;
    let vx=0,vy=0,vz=0,cnt=0;
    for(const [a,b] of E){if((g[a]<0)===(g[b]<0))continue;const t=g[a]/(g[a]-g[b]);
      vx+=(a&1)+((b&1)-(a&1))*t;vy+=((a>>1)&1)+(((b>>1)&1)-((a>>1)&1))*t;vz+=((a>>2)&1)+(((b>>2)&1)-((a>>2)&1))*t;cnt++;}
    cell[id(i,j,k)]=pos.length/3;pos.push(o[0]+(i+vx/cnt)*s,o[1]+(j+vy/cnt)*s,o[2]+(k+vz/cnt)*s);
    gr.push(g[1]-g[0]+g[3]-g[2]+g[5]-g[4]+g[7]-g[6],g[2]-g[0]+g[3]-g[1]+g[6]-g[4]+g[7]-g[5],g[4]-g[0]+g[5]-g[1]+g[6]-g[2]+g[7]-g[3]);
  }
  const idx=[];
  const quad=(a,b,c,d,flip)=>{if(a<0||b<0||c<0||d<0)return;flip?idx.push(a,d,c,a,c,b):idx.push(a,b,c,a,c,d);};
  for(let k=0;k<nz-1;k++)for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){
    const v0=f[id(i,j,k)]<0;
    if(j>0&&k>0&&(f[id(i+1,j,k)]<0)!==v0)quad(cell[id(i,j,k)],cell[id(i,j-1,k)],cell[id(i,j-1,k-1)],cell[id(i,j,k-1)],!v0);
    if(i>0&&k>0&&(f[id(i,j+1,k)]<0)!==v0)quad(cell[id(i,j,k)],cell[id(i,j,k-1)],cell[id(i-1,j,k-1)],cell[id(i-1,j,k)],!v0);
    if(i>0&&j>0&&(f[id(i,j,k+1)]<0)!==v0)quad(cell[id(i,j,k)],cell[id(i-1,j,k)],cell[id(i-1,j-1,k)],cell[id(i,j-1,k)],!v0);
  }
  const nv=pos.length/3,P=new Float32Array(pos),nrm=new Float32Array(nv*3),col=new Float32Array(nv*3),rgh=new Float32Array(nv),mat=new Float32Array(nv);
  const mR=[.62,.86,.36,.48,.95,.12,.72];
  for(let v=0;v<nv;v++){
    const x=P[v*3],y=P[v*3+1],z=P[v*3+2],gx=gr[v*3],gy=gr[v*3+1],gz=gr[v*3+2],l=Math.hypot(gx,gy,gz)||1;
    nrm[v*3]=gx/l;nrm[v*3+1]=gy/l;nrm[v*3+2]=gz/l;
    const C0=cL(x-gx/l*.002,y-gy/l*.002,z-gz/l*.002);let mul=C0.mul;
    if(C0.m===MAT.skin)mul*=1+(vnoise(x,y,z,.035)-.5)*.1;
    const rgb=linRGB(C0.hex,mul);col[v*3]=rgb[0];col[v*3+1]=rgb[1];col[v*3+2]=rgb[2];mat[v]=C0.m;rgh[v]=mR[C0.m]||.62;
  }
  const I=new Uint32Array(idx);
  // 三角形朝向校正：几何法线与 SDF 梯度反向就翻
  for(let t=0;t<I.length;t+=3){const a=I[t],b=I[t+1],c=I[t+2];
    const ux=P[b*3]-P[a*3],uy=P[b*3+1]-P[a*3+1],uz=P[b*3+2]-P[a*3+2],wx=P[c*3]-P[a*3],wy=P[c*3+1]-P[a*3+1],wz=P[c*3+2]-P[a*3+2];
    const cx=uy*wz-uz*wy,cy=uz*wx-ux*wz,cz=ux*wy-uy*wx;
    if(cx*(nrm[a*3]+nrm[b*3]+nrm[c*3])+cy*(nrm[a*3+1]+nrm[b*3+1]+nrm[c*3+1])+cz*(nrm[a*3+2]+nrm[b*3+2]+nrm[c*3+2])<0){I[t+1]=c;I[t+2]=b;}}
  PF=null;CM=null;
  return {pos:P,nrm,col,mat,rgh,idx:I,tris:I.length/3};
}
/* Worker 入口：主线程给骨骼矩阵，这里出一帧身体的体素网格 */
function workerJob(job){
  if(job.decals){installDecals(job.decals);return {msg:{id:job.id},transfer:[]};}
  OPT=job.opt;HANDS=job.hands;buildLayers();setDM(job.dm,job.ballOn);
  if(job.kind==='smooth'){const d=smoothData(job.s,P=>P.bone!==HB);return {msg:{id:job.id,data:d},transfer:[d.pos.buffer,d.nrm.buffer,d.col.buffer,d.mat.buffer,d.rgh.buffer,d.idx.buffer]};}
  const data=voxelBody(job.s),tr=[];
  for(const k in data.buckets){const b=data.buckets[k];for(const a of ['p','nrm','c','mt','sn','ao','idx'])tr.push(b[a].buffer);}
  return {msg:{id:job.id,data},transfer:tr};
}

  T:2.4,tRel:.86,tHide:1.78,tIn:1.95,fps:+(qs.get('fps')||12),speed:1,playing:qs.get('play')!=='0',t:+(qs.get('t')||0),

function animPose(t){

/* ---------- Worker 池（失败就退回主线程逐帧算） ---------- */
const POOL=[],QUEUE=[];let POOL_OK=null,JOB_ID=1;
function makePool(){
  if(POOL_OK!==null)return POOL_OK;
  try{
    const three=new URL('../../vendor/three.min.r128.js',location.href).href;
    const src=`importScripts(${JSON.stringify(three)});\n${document.getElementById('core').textContent}\n;self.onmessage=e=>{const r=workerJob(e.data);self.postMessage(r.msg,r.transfer);};`;
    const url=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));
    const n=clamp((navigator.hardwareConcurrency||4)-1,1,8);
    for(let i=0;i<n;i++){const w=new Worker(url);w.postMessage({id:-1,decals:DEC});POOL.push({w,busy:false});}
    POOL_OK=true;
  }catch(e){console.warn('worker 不可用，改主线程烘焙',e);POOL_OK=false;}
  return POOL_OK;
}
function runJob(job,dead){return new Promise(res=>{QUEUE.push({job,res,dead});pump();});}
function pump(){
  while(QUEUE.length&&QUEUE[0].dead&&QUEUE[0].dead())QUEUE.shift().res(null);   // 已作废的烘焙直接丢掉
  if(!POOL_OK){ // 主线程退路：一帧一帧让出事件循环
    if(pump.busy||!QUEUE.length)return;pump.busy=true;
    setTimeout(()=>{const q=QUEUE.shift();const r=workerJob(q.job);pump.busy=false;q.res(r.msg.data);pump();},0);return;
  }
  for(const p of POOL){
    while(QUEUE.length&&QUEUE[0].dead&&QUEUE[0].dead())QUEUE.shift().res(null);
    if(p.busy||!QUEUE.length)continue;
    const q=QUEUE.shift();p.busy=true;
    p.w.onmessage=e=>{if(e.data.id!==q.job.id)return;p.busy=false;q.res(e.data.data);pump();};
    p.w.onerror=err=>{console.warn('worker 出错，改主线程',err);POOL_OK=false;p.busy=false;QUEUE.unshift(q);pump();};
    p.w.postMessage(q.job);

}
/* 烘焙一整段 2.4s 动画。style：'vox'（B/E 体素，头部走头骨网格）或 'smooth'（D 平滑，头部细网格）。
   withBall=false 时球不进网格——球场里的球由投篮判定单独驱动，动画帧只记录"球在手里的位置"。 */
function bakeFrames(style,withBall,fps,onFrame,near){

  B.frames=new Array(B.N).fill(null);
  applyPose(POSES.hold);   // 头部网格只算一次（头骨局部空间，和姿势无关），每帧只换矩阵
  B.head=style==='vox'?geosFrom(voxelHead(.012)):buildSmooth(.0025,P=>P.bone===HB,DM[HB],headBounds());

function setupAnim(){

(function buildCourt(){

function refreshUI(){
  buttons('rScene',[['lab','实验室'],['court','▶ 球场蓄力投篮']],CT.on?'court':'lab',k=>{if(k==='court'&&!CT.on)enterCourt();else if(k==='lab'&&CT.on)exitCourt();});
  buttons('rStyle',[['smooth','D 平滑'],['hyb','E 体素卡渲']],CT.style,k=>{CT.style=k;ST.mode=k;CT.shown=null;ctBake(k);refreshUI();});
  buttons('rDiff',Object.entries(CT_DIFF).map(([k,v])=>[k,v.n]),CT.diff,k=>{CT.diff=k;refreshUI();});
  buttons('rCCam',[['over','越肩'],['side','转播侧面']],CT.cam,k=>{CT.cam=k;refreshUI();});
  if(CT.on){document.getElementById('note').textContent='从 AIBA 剥出来的蓄力投篮：按住蓄力、在甜区松手。判定规则、飞行时间、甜区宽度都和 AIBA 一致；角色动作由蓄力相位驱动，满值那一帧就是出手帧。';return;}
  buttons('rMode',MODES,ST.mode,k=>{ST.mode=k;if(ST.pose==='anim'&&k!=='v12'&&k!=='hyb')ST.pose='set';rebuild(false);});
  buttons('rPose',[...Object.entries(POSES).map(([k,v])=>[k,v.name]),['anim','▶ 投篮动画']],ST.pose,k=>{ST.pose=k;rebuild(true);});
  const ra=document.getElementById('rAnim');ra.style.display=ST.pose==='anim'?'':'none';
  buttons('rAnim',[['play',ANIM.playing?'暂停':'播放'],['1','1×'],['.5','0.5×'],['.25','0.25×'],['f12','12fps'],['f24','24fps']],'',k=>{
    if(k==='play')ANIM.playing=!ANIM.playing;else if(k[0]==='f'){ANIM.fps=+k.slice(1);rebuild(false);}else ANIM.speed=+k;refreshUI();});
  const onSp={1:'1×',.5:'0.5×',.25:'0.25×'}[ANIM.speed];
  for(const b of ra.querySelectorAll('button'))if(b.textContent===onSp||b.textContent===ANIM.fps+'fps')b.className='on';
  ra.appendChild(document.getElementById('aScrub'));
  buttons('rCam',Object.entries(CAMS).map(([k,v])=>[k,v[0]]),ST.cam,k=>{ST.cam=k;frame(k);refreshUI();req();});
  buttons('rSleeve',[['black','黑'],['white','白'],['none','无']],OPT.sleeve,k=>{OPT.sleeve=k;rebuild(false);});
  document.getElementById('note').textContent=MODE_NOTE[ST.mode];
  document.getElementById('rPix').style.display=ST.mode==='pix'||ST.mode==='all'?'':'none';
  document.getElementById('pixv').textContent=ST.pix+' px/格';
}
function rebuild(reframe){
  setBusy('构建中…');refreshUI();
  setTimeout(()=>{setBusy(null);ensure();if(reframe&&ST.pose!=='anim')frame(ST.cam);refreshUI();req();},30);
}
document.getElementById('pix').value=ST.pix;
document.getElementById('aScrub').oninput=e=>{ANIM.playing=false;ANIM.t=+e.target.value*ANIM.T*.9999;showAt(ANIM.t);refreshUI();};
document.getElementById('pix').oninput=e=>{ST.pix=+e.target.value;refreshUI();req();};
document.getElementById('hide').onclick=()=>document.body.classList.toggle('nohud');
addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('nohud');if(e.code==='Space'&&CT.on){e.preventDefault();if(!e.repeat)ctCharge();}});
addEventListener('keyup',e=>{if(e.code==='Space'&&CT.on){e.preventDefault();ctRelease();}});
let drag=null;
canvas.addEventListener('pointerdown',e=>{if(CT.on){if(e.button===0)ctCharge();return;}drag={x:e.clientX,y:e.clientY,yaw:ST.yaw,pitch:ST.pitch};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;ST.yaw=drag.yaw-(e.clientX-drag.x)*.008;ST.pitch=clamp(drag.pitch+(e.clientY-drag.y)*.005,-.4,1.2);req();});
canvas.addEventListener('pointerup',()=>{drag=null;if(CT.on)ctRelease();});
canvas.addEventListener('wheel',e=>{e.preventDefault();ST.dist=clamp(ST.dist*Math.exp(e.deltaY*.001),.5,14);req();},{passive:false});
canvas.addEventListener('dblclick',()=>{frame(ST.cam);req();});
addEventListener('resize',req);
OPT.sleeve=qs.get('sleeve')||'black';
if(qs.get('nohud'))document.body.classList.add('nohud');
if(CT.on){CT.on=false;enterCourt();}else{refreshUI();ensure();if(ST.pose!=='anim')frame(ST.cam);refreshUI();render();}
window.LAB={ST,OPT,POSES,ANIM,CT,ctCharge,ctRelease,ctTickManual(now){CT.raf=0;const on=CT.on;ctTick(now);if(CT.raf){cancelAnimationFrame(CT.raf);CT.raf=0;}},wp:(bn,p)=>new T.Vector3(...p).applyMatrix4(DM[BI[bn]]).toArray(),render,rebuild,frame,ensure,CACHE,seek(t){ANIM.playing=false;ANIM.t=t;showAt(t,true);},tune(pose,rot){Object.assign(POSES[pose].rot,rot);for(const k in CACHE)delete CACHE[k];ST.pose=pose;rebuild(true);}};
</script>
</body>
</html>
