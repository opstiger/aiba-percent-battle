<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Kobe 角色实验室</title>
<!-- 独立实验页，不接游戏主链路。
     一份角色定义（骨架 + 有符号距离场 SDF + 上色函数），四种渲染：
       A 体素 2cm   B 体素 1.2cm   C 3D→像素化（卡渲 + 同色系描边）   D 平滑雕塑（参照）
     URL: ?mode=v20|v12|pix|smooth|all &pose=idle|hold|fade &cam=front|tq|side|back|face -->
<style>
  :root{--panel:rgba(18,19,23,.84);--line:rgba(255,255,255,.09);--text:#eceae6;--dim:#8e8a84;--accent:#f2b02a;--purple:#8a5cc7}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    background:radial-gradient(ellipse 70% 60% at 50% 42%,#3a3a3f 0%,#232327 48%,#141417 100%)}
  canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  #labels .lab{position:fixed;padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:12px;pointer-events:none;white-space:nowrap}
  #labels .lab small{color:var(--dim);font-weight:500;margin-left:6px}
  #ui{position:fixed;left:16px;top:16px;width:min(300px,calc(100vw - 32px));padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);max-height:calc(100vh - 32px);overflow:auto}
  #ui h1{font-size:14px;letter-spacing:.02em}
  #ui p.sub{color:var(--dim);font-size:12px;margin:2px 0 10px}
  .row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
  .row>label{width:100%;color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em}
  button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);border-radius:8px;padding:4px 9px;font:inherit;font-size:12px;cursor:pointer}
  button:hover{background:rgba(255,255,255,.08)}
  button.on{border-color:var(--accent);color:var(--accent);background:rgba(242,176,42,.09)}
  input[type=range]{width:100%;accent-color:var(--accent)}
  #note{color:var(--dim);font-size:11.5px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
  #stat{font-variant-numeric:tabular-nums;color:var(--dim);font-size:11px;margin-top:6px}
  #busy{position:fixed;right:18px;bottom:18px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12px;opacity:0;transition:opacity .15s}
  body.busy #busy{opacity:1}
  #hide{position:fixed;right:16px;top:16px}
  body.nohud #ui,body.nohud #labels,body.nohud #busy,body.nohud #hide{display:none}
  #court{display:none}
  body.court #court{display:block}
  body.court .row:not(.cOnly):not(#rScene):not(#rProp),body.court #labels{display:none}
  .cOnly{display:none}body.court .cOnly{display:flex}
  #cScore{position:fixed;right:20px;top:60px;padding:8px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:13px}
  #cScore b{font-size:22px;color:var(--accent)}#cScore small{color:var(--dim);margin-left:6px}
  #cHint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:6px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;color:var(--dim);white-space:nowrap}
  #cToast{position:fixed;left:50%;top:18%;transform:translate(-50%,0);font-size:34px;font-weight:800;letter-spacing:.04em;opacity:0;text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none}
  #cToast.show{animation:toast 1.3s ease-out}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,10px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1.06)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
  #cBar{position:fixed;right:34px;top:50%;transform:translateY(-50%);width:16px;height:260px;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid var(--line);overflow:hidden}
  #cZone{position:absolute;left:0;right:0;background:rgba(242,176,42,.22)}
  #cSweet{position:absolute;left:0;right:0;background:rgba(255,214,90,.75)}
  #cFill{position:absolute;left:3px;right:3px;bottom:0;border-radius:6px;background:linear-gradient(#fff,#cfd6e2);mix-blend-mode:screen}
  @media (max-width:640px){#ui{top:auto;bottom:16px;max-height:46vh}}
</style>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<button id="hide" title="隐藏面板 (H)">面板</button>
<div id="ui">
  <h1>Kobe #24 · 角色实验室 <small style="font-size:10.5px;color:var(--accent);font-weight:normal">v2.8 真耳朵/后脑/灰调浅寸头/头+15%/短脖</small></h1>
  <p class="sub">同一份角色定义，五种渲染。拖动旋转，滚轮缩放，双击复位。</p>
  <div class="row" id="rScene"><label>场景</label></div>
  <div class="row cOnly" id="rStyle"><label>球员风格</label></div>
  <div class="row cOnly" id="rDiff"><label>难度（AIBA）</label></div>
  <div class="row cOnly" id="rCCam"><label>机位</label></div>
  <div class="row" id="rChar"><label>球员</label></div>
  <div class="row" id="rMode"><label>渲染</label></div>
  <div class="row" id="rPose"><label>姿势</label></div>
  <div class="row" id="rAnim"><label>投篮动画 <span id="animv"></span></label><input id="aScrub" type="range" min="0" max="1" step="0.001" value="0"></div>
  <div class="row" id="rCam"><label>机位</label></div>
  <div class="row" id="rProp"><label>头身比（只变头和四肢粗细，骨架和动作不变）</label></div>
  <div class="row" id="rSleeve"><label>右臂护套</label></div>
  <div class="row" id="rPix"><label>像素颗粒 <span id="pixv"></span></label><input id="pix" type="range" min="2" max="10" step="1" value="4"></div>
  <div id="note"></div>
  <div id="stat"></div>
</div>
<div id="busy">构建中…</div>
<div id="court"><div id="cScore"></div><div id="cToast"></div><div id="cHint"></div>
  <div id="cBar"><div id="cZone"></div><div id="cSweet"></div><div id="cFill"></div></div></div>
<script src="../../vendor/three.min.r128.js"></script>
<script src="../../src/lab/kobe-core.js"></script>
<script>
"use strict";
/* ======== 以下只在主线程：贴花绘制、平滑网格、渲染、UI、动画 ======== */
/* 每位球星一套贴花（胸前字、背后名字号码、鞋侧标），装进核心，Worker 池同样各发一份 */
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const DECS=ROSTER_IDS.map(id=>{const D=buildDecals(mkCanvas,id);installDecals(D,id);return D;});
const SHORT={kobe:'科比',jordan:'乔丹',iverson:'艾弗森',carter:'卡特',nowitzki:'诺维茨基',allen:'雷·阿伦',curry:'库里',mcgrady:'麦迪',harden:'哈登',irving:'欧文',durant:'杜兰特',doncic:'东契奇'};
const LINEUP=()=>ST.mode==='props'||ST.mode==='roster';

/* =====================================================================
   7b. 平滑网格：Surface Nets + SDF 梯度法线
   ===================================================================== */
function smoothGeo(d){
  const geo=new T.BufferGeometry(),nv=d.pos.length/3;
  geo.setAttribute('position',new T.BufferAttribute(d.pos,3));geo.setAttribute('normal',new T.BufferAttribute(d.nrm,3));
  geo.setAttribute('color',new T.BufferAttribute(d.col,3));geo.setAttribute('mat',new T.BufferAttribute(d.mat,1));geo.setAttribute('roughness',new T.BufferAttribute(d.rgh,1));
  geo.setAttribute('sn',geo.attributes.normal);geo.setAttribute('ao',new T.BufferAttribute(new Float32Array(nv).fill(1),1));geo.setIndex(new T.BufferAttribute(d.idx,1));
  geo.userData={verts:nv,tris:d.tris};return geo;
}
function buildSmooth(s,filter,M,bb){return smoothGeo(smoothData(s,filter,M,bb));}
function headBounds(){
  const mn=[9,9,9],mx=[-9,-9,-9];
  for(const ly of LAYERS)for(const P of ly.prims)if(P.bone===HB&&P.op==='u')for(let a=0;a<3;a++){mn[a]=Math.min(mn[a],P.bc[a]-P.br);mx[a]=Math.max(mx[a],P.bc[a]+P.br);}
  return {mn,mx};
}
function buildSmoothAll(){
  const body=buildSmooth(.0075,P=>P.bone!==HB),head=buildSmooth(.0025,P=>P.bone===HB,DM[HB],headBounds());
  return {body,head,headM:DM[HB].clone(),tris:body.userData.tris+head.userData.tris};
}
function smoothShow(target,sm,mat,cast){
  for(const [g,M] of [[sm.body,null],[sm.head,sm.headM]]){const m=new T.Mesh(g,mat);m.castShadow=m.receiveShadow=!!cast;if(M){m.matrixAutoUpdate=false;m.matrix.copy(M);}target.add(m);}
}

/* =====================================================================
   8. 渲染器、灯光、材质
   ===================================================================== */
const canvas=document.getElementById('c');
const renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio));
renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.66;   // r128 的 ACES 内部还会 ÷0.6
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.setClearColor(0,0);
const scene=new T.Scene(),camera=new T.PerspectiveCamera(24,1,.05,60);

// 摄影棚环境（PMREM）：顶部柔光 + 两块柔光箱
(function(){ // 等距柱状 HDR：竖向渐变 + 柔光箱（浮点 DataTexture）
  const W=256,H=128,d=new Float32Array(W*H*4);
  const boxes=[[-.75,.55,.5,.3,[3.4,3.1,2.8]],[2.4,.2,.25,.55,[2.2,2.3,2.9]],[.9,.12,.35,.4,[.9,.95,1.15]]]; // [经度,纬度,半宽,半高,色]
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const lon=(x/W)*Math.PI*2-Math.PI,lat=(.5-y/H)*Math.PI,h=Math.sin(lat),t=clamp((h+.3)/1.2,0,1),s=t*t*(3-2*t);
    let c=[.05+.29*s,.045+.285*s,.045+.275*s];
    for(const [bl,bt,bw,bh,bc] of boxes){let dl=Math.abs(lon-bl);dl=Math.min(dl,Math.PI*2-dl);if(dl<bw&&Math.abs(lat-bt)<bh)c=bc;}
    const i=(y*W+x)*4;d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=1;
  }
  const tex=new T.DataTexture(d,W,H,T.RGBAFormat,T.FloatType);tex.mapping=T.EquirectangularReflectionMapping;tex.needsUpdate=true;
  const pm=new T.PMREMGenerator(renderer);scene.environment=pm.fromEquirectangular(tex).texture;
})();

const rig=new T.Group();scene.add(rig);
const key=new T.DirectionalLight(0xfff0dc,1.55);key.position.set(-2.6,4.4,3.4);
key.castShadow=true;key.shadow.mapSize.set(4096,4096);Object.assign(key.shadow.camera,{left:-1.6,right:1.6,top:1.6,bottom:-1.6,near:.5,far:12});
key.shadow.bias=-.0003;key.shadow.normalBias=.012;key.shadow.radius=3;key.target.position.set(0,1,0);
const fill=new T.DirectionalLight(0xc9d6ff,.32);fill.position.set(3.6,1.6,2.6);fill.target.position.set(0,1,0);
const rimA=new T.DirectionalLight(0xffffff,1.25);rimA.position.set(2.6,3.2,-3.6);rimA.target.position.set(0,1,0);
const rimB=new T.DirectionalLight(0xd8c6ff,.7);rimB.position.set(-3,2.6,-3);rimB.target.position.set(0,1,0);
rig.add(key,key.target,fill,fill.target,rimA,rimA.target,rimB,rimB.target);
scene.add(new T.HemisphereLight(0x9aa2b0,0x2a2320,.3));
// 地台：投影 + 接触阴影
const floor=new T.Mesh(new T.CircleGeometry(4,64),new T.ShadowMaterial({opacity:.42}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const contact=(()=>{const cv=document.createElement('canvas');cv.width=cv.height=128;const g=cv.getContext('2d');const gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(0,0,0,.55)');gr.addColorStop(.5,'rgba(0,0,0,.22)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);
  const m=new T.Mesh(new T.PlaneGeometry(1,1),new T.MeshBasicMaterial({map:new T.CanvasTexture(cv),transparent:true,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.y=.001;scene.add(m);return m;})();

const std=(o)=>new T.MeshStandardMaterial(Object.assign({vertexColors:true,metalness:0},o));
const MATS={0:std({roughness:.62,envMapIntensity:.45}),1:std({roughness:.86,envMapIntensity:.35}),2:std({roughness:.36,envMapIntensity:.95}),
  3:std({roughness:.48,envMapIntensity:.7}),4:std({roughness:.95,envMapIntensity:.2}),5:std({roughness:.12,envMapIntensity:1.4}),6:std({roughness:.72,envMapIntensity:.3})};
const smoothMat=std({roughness:.55,envMapIntensity:.7});
smoothMat.onBeforeCompile=sh=>{ // 平滑版按顶点材质真实连续粗糙度
  sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nattribute float roughness;varying float vRoughness;').replace('#include <begin_vertex>','#include <begin_vertex>\nvRoughness=roughness;');
  sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying float vRoughness;')
    .replace('#include <roughnessmap_fragment>','#include <roughnessmap_fragment>\nroughnessFactor=vRoughness;');
};

/* ---------- 像素化管线：卡渲（色相偏移的阴影带）→ 低分辨率 → 同色系描边 ---------- */
const toonMat=new T.ShaderMaterial({vertexColors:true,uniforms:{kD:{value:new T.Vector3()},fD:{value:new T.Vector3()},rD:{value:new T.Vector3()},uS:{value:0},uA:{value:1}},
  vertexShader:`attribute float mat,ao;attribute vec3 sn;uniform float uS,uA;varying vec3 vN,vC,vV;varying float vM;void main(){vN=normalize(normalMatrix*normalize(mix(normal,sn,uS)));vC=color/max(ao,.2)*mix(1.,ao,uA);vM=mat;vec4 mv=modelViewMatrix*vec4(position,1.);vV=-mv.xyz;gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform vec3 kD,fD,rD;varying vec3 vN,vC,vV;varying float vM;
  void main(){vec3 N=normalize(vN),V=normalize(vV);float k=dot(N,kD),f=max(dot(N,fD),0.);
    vec3 b=vC;vec3 c;
    if(k>.42)c=b*vec3(1.1,1.06,.98);            // 亮面：偏暖
    else if(k>-.05)c=b*vec3(.86,.84,.9);         // 中间调
    else c=b*vec3(.5,.47,.66);                    // 暗面：偏冷偏紫
    c+=b*f*.12;
    float r=pow(1.-max(dot(N,V),0.),2.6)*max(dot(N,rD),0.);
    if(r>.16)c=mix(c,vec3(1.,.96,.9)*max(b*2.2,vec3(.25)),.55);   // 轮廓光
    if(vM>4.5&&vM<5.5&&k>.5&&dot(reflect(-kD,N),V)>.9)c=vec3(1.);   // 眼神光
    gl_FragColor=vec4(pow(c,vec3(1./2.2)),1.);}`});
const pixScene=new T.Scene();
const pixShadow=new T.Mesh(new T.CircleGeometry(.42,40),new T.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.34,depthWrite:false}));
pixShadow.rotation.x=-Math.PI/2;pixScene.add(pixShadow);
const RTS={};
const postMat=new T.ShaderMaterial({transparent:true,depthTest:false,depthWrite:false,uniforms:{tC:{value:null},tD:{value:null},px:{value:new T.Vector2()},cn:{value:.05},cf:{value:60},th:{value:1}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
  fragmentShader:`uniform sampler2D tC,tD;uniform vec2 px;uniform float cn,cf,th;varying vec2 vUv;
  float lin(float d){float z=d*2.-1.;return 2.*cn*cf/(cf+cn-z*(cf-cn));}
  void main(){vec4 c=texture2D(tC,vUv);float d=texture2D(tD,vUv).x;
    vec2 o[8];o[0]=vec2(px.x,0.);o[1]=vec2(-px.x,0.);o[2]=vec2(0.,px.y);o[3]=vec2(0.,-px.y);
    o[4]=o[0]*th;o[5]=o[1]*th;o[6]=o[2]*th;o[7]=o[3]*th;
    if(c.a<.9){                                  // 背景：若贴着角色 → 画外描边（取邻像素颜色压暗，sel-out）
      float best=2.;vec3 bc=vec3(0.);
      for(int i=0;i<8;i++){vec4 cn2=texture2D(tC,vUv+o[i]);float dn=texture2D(tD,vUv+o[i]).x;if(cn2.a>.9&&dn<best){best=dn;bc=cn2.rgb;}}
      if(best<1.5){gl_FragColor=vec4(bc*vec3(.26,.22,.32),1.);return;}
      gl_FragColor=c;return;}
    float L=lin(d),m=0.;
    for(int i=0;i<4;i++){vec4 cn2=texture2D(tC,vUv+o[i]);if(cn2.a>.9&&lin(texture2D(tD,vUv+o[i]).x)<L-.06)m=1.;}
    gl_FragColor=vec4(mix(c.rgb,c.rgb*vec3(.48,.44,.58),m*.9),1.);}`});
const postQuad=new T.Mesh(new T.PlaneGeometry(2,2),postMat),postScene=new T.Scene(),postCam=new T.OrthographicCamera(-1,1,1,-1,0,1);
postQuad.frustumCulled=false;postScene.add(postQuad);

/* =====================================================================
   9. 状态、构建、渲染
   ===================================================================== */
const qs=new URLSearchParams(location.search);
const ST={mode:qs.get('mode')||'all',pose:qs.get('pose')||'idle',cam:qs.get('cam')||'tq',pix:+(qs.get('px')||4),yaw:0,pitch:0,dist:0,tx:0,ty:0,tz:0};
/* 头身比变体：f 头部放大倍数（相对当前），g 四肢粗细。头身数按 头顶高 ÷（头顶 − 下巴）算 */
const PROPS=[{k:'5',n:'5 头身',f:1.654,g:1.2},{k:'6',n:'6 头身',f:1.325,g:1.1},{k:'6.5',n:'6.5 头身',f:1.206,g:1.06},{k:'7',n:'7 头身（游戏）',f:1.106,g:1.03},{k:'7.6',n:'7.6 头身（真实）',f:1,g:1}];
const propOf=k=>PROPS.find(p=>p.k===k)||PROPS[4];
function propStats(){const crown=headPt([0,1.954,0])[1],chin=headPt([0,1.732,0])[1];return {h:crown,heads:crown/(crown-chin)};}
const MODES=[['v20','A 体素 2cm'],['v12','B 体素 1.2cm'],['pix','C 3D→像素化'],['smooth','D 平滑雕塑'],['hyb','E 体素+卡渲描边'],['all','五联对比'],['props','E · 五种头身并排'],['roster','E · 全部球星并排']];
const MODE_NOTE={v20:'真 3D 体素，每格 2cm（身高约 100 格）。方块感最强，五官靠上色，一格眼睛。',
  v12:'每格 1.2cm（约 165 格）。眉弓、鼻梁、嘴唇、肌肉开始有体积，字母和号码能读。',
  pix:'平滑 3D 模型 → 三段卡渲（亮面偏暖、暗面偏紫）→ 低分辨率 → 同色系加深描边 + 内轮廓线。Dead Cells / 八方旅人一类管线。',
  smooth:'额外思路：同一份定义直接出平滑网格 + PBR，"手办"质感。不是像素风，作参照。',
  hyb:'第五版（上一轮的建议）：B 的 1.2cm 方块几何，换成 C 的三段卡渲（亮面偏暖、暗面偏紫）+ 同色系外描边 + 肢体交叠内轮廓线。方块保留体积，描边给成品感。',
  all:'同一姿势、同一机位，五种渲染并排。拖动任意一格一起转。',
  roster:'E 体素卡渲，同一套骨架和建模代码，按球星档案换身高体格、肤色、发型胡子几何、脸部像素图、球衣配色字样、鞋袜护具。哈登是左手，整身镜像。',
  props:'E 体素卡渲，同一姿势、同一骨架，只改头的大小和四肢粗细：5 / 6 / 6.5 / 7 / 7.6（当前）头身并排。头部方块随头等比放大，脸部像素图逐格对齐。'};
const CAMS={front:['正面',0,.04],tq:['3/4',.62,.07],side:['侧面(右)',-Math.PI/2,.04],back:['背面',Math.PI,.06],face:['面部特写',.42,.02],feet:['球鞋特写',.62,.30]};
const CACHE={};let CUR=null;
const groups={v20:new T.Group(),v12:new T.Group(),smooth:new T.Group()};for(const g in groups)scene.add(groups[g]);
const pixMesh=new T.Group();pixScene.add(pixMesh);   // C：平滑网格（身体 + 细网格头）+ 卡渲材质
const hybGroup=new T.Group();pixScene.add(hybGroup);   // E：1.2cm 体素几何 + 卡渲材质

function need(mode){return mode==='all'?['v20','v12','smooth']:mode==='pix'?['smooth']:mode==='hyb'?['v12']:[mode];}
function geosFrom(data){
  const out=[];
  for(const m in data.buckets){const b=data.buckets[m],g=new T.BufferGeometry();
    g.setAttribute('position',new T.BufferAttribute(b.p,3));g.setAttribute('normal',new T.BufferAttribute(b.nrm,3,true));
    g.setAttribute('color',new T.BufferAttribute(b.c,3));g.setAttribute('mat',new T.BufferAttribute(b.mt,1));
    g.setAttribute('sn',new T.BufferAttribute(b.sn,3,true));g.setAttribute('ao',new T.BufferAttribute(b.ao,1,true));
    g.setIndex(new T.BufferAttribute(b.idx,1));out.push({m:+m,geo:g});}

}
function vgroup(parts,mat,M){

    if(M){mesh.matrixAutoUpdate=false;mesh.matrix.copy(M);}g.add(mesh);}

}
/* 静态姿势的体素：身体走世界网格，头走头骨局部网格（脸部像素图逐格对齐） */
function buildVox(s){const b=voxelBody(s),h=voxelHead(s);return {body:geosFrom(b),head:geosFrom(h),headM:DM[HB].clone(),count:b.count+h.count};}
function voxShow(target,v,mat,headM){target.add(vgroup(v.body,mat,null));target.add(vgroup(v.head,mat,headM||v.headM));}

/* 五种头身并排：每种各建一次（按姿势缓存），横向排开，每人脚下一块阴影 */

/* =====================================================================
   10. 投篮动画
   关键帧 = 上面的静态姿势（各自先解好 IK），帧与帧之间插值骨骼局部旋转：
     接球 → 持球下沉 → 置球点 → 后仰出手（离地）→ 随挥落地 → 停住 → 下一记传球飞回手里（闭环）
   持球段：球挂在投篮手上（手掌局部坐标插值），辅助手每帧重新 IK 贴球。
   出手后球按抛物线 + 后旋飞出画面；循环末尾一记胸前传球从正前方飞回。
   每一帧都在世界网格里重新体素化（方块永远和地面对齐，不是刚体拼块），
   所以用 Web Worker 并行烘焙；头部网格只算一次，每帧只换矩阵。
   默认 12fps 逐格播放——像素动画的传统做法，也是风格的一部分。
   ===================================================================== */
const ANIM={keys:[['catch',0],['hold',.32],['set',.66],['fade',.86],['snap',1.03],['follow',1.32],['follow',1.72],['catch',2.4]],
  T:2.4,tRel:.86,tHide:1.78,tIn:1.95,fps:+(qs.get('fps')||12),speed:1,playing:qs.get('play')!=='0',t:+(qs.get('t')||0),
  kd:null,bk:null,sig:'',raf:0,shown:null,last:0,bounds:null,face:null};
const BALL_V=[.05,5.3,3.4],BALL_VIN=[0,-2.2,-7],GRAV=-9.8;
const lerp=(a,b,t)=>a+(b-a)*t,lerp3=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
function keyData(name){
  setChar(OPT.char);
  const P=POSES[name],S=solvePose(P),loc=[];
  for(let i=0;i<NB;i++){
    if(!S.W[i]){loc.push(null);continue;}
    const b=BN[i],L=b.parent<0?S.W[i].clone():S.W[b.parent].clone().invert().multiply(S.W[i]);
    const p=new T.Vector3(),q=new T.Quaternion();L.decompose(p,q,new T.Vector3());loc.push({p,q});
  }
  const Dh=dmFromW(S.W,BI.handR);
  return {loc,ball:S.ball,ballLocal:S.ball?S.ball.clone().applyMatrix4(Dh.clone().invert()):null,
    guide:P.ik&&P.ik.armL&&P.ik.armL.on==='ball'?P.ik.armL:null,hand:P.hand||{}};
}
/* 关键帧只和 POSES 有关：解一次，实验室动画和球场共用 */
function ensureKeys(){
  if(ANIM.kd)return;
  ANIM.kd=ANIM.keys.map(([k])=>keyData(k));
  ANIM.relPos=ANIM.kd[3].ball.clone();ANIM.catchPos=ANIM.kd[0].ball.clone();   // kd[3] = fade（出手帧），kd[0] = 接球
  let mn=[9,9,9],mx=[-9,-9,-9];
  for(const [k] of ANIM.keys){applyPose(POSES[k]);const b=bounds();for(let a=0;a<3;a++){mn[a]=Math.min(mn[a],b.mn[a]);mx[a]=Math.max(mx[a],b.mx[a]);}}
  ANIM.bounds={mn,mx};
  applyPose(POSES.hold);ANIM.face=new T.Vector3(...headPt([0,1.855,.03])).applyMatrix4(DM[HB]).toArray();
}
function animPose(t){
  const K=ANIM.keys,kd=ANIM.kd;let a=0;while(a<K.length-2&&t>=K[a+1][1])a++;
  const b=a+1,u=clamp((t-K[a][1])/(K[b][1]-K[a][1]),0,1),A=kd[a],B=kd[b];
  // 置球→出手 ease-out（蹬地快、到顶慢）；出手→压腕先停 0.03s 再翻（球先离手）；压腕→落地 ease-in
  const kn=K[a][0];
  const e=kn==='set'?1-(1-u)*(1-u):kn==='fade'?(v=>v*v*(3-2*v))(clamp((u-.18)/.82,0,1)):kn==='snap'?u*u:u*u*(3-2*u);
  const W=[];
  for(let i=0;i<NB;i++){if(!A.loc[i])continue;
    const p=A.loc[i].p.clone().lerp(B.loc[i].p,e),q=A.loc[i].q.clone().slerp(B.loc[i].q,e);
    const L=new T.Matrix4().compose(p,q,new T.Vector3(1,1,1));W[i]=BN[i].parent<0?L:W[BN[i].parent].clone().multiply(L);}
  let ball=null,spin=0;
  if(t<ANIM.tRel&&A.ballLocal&&B.ballLocal){
    ball=A.ballLocal.clone().lerp(B.ballLocal,e).applyMatrix4(dmFromW(W,BI.handR));
    if(A.guide&&B.guide){   // 辅助手：每帧贴球重解
      const g={on:'ball',u:lerp3(nrm(A.guide.u),nrm(B.guide.u),e),f:lerp3(A.guide.f,B.guide.f,e),pole:lerp3(A.guide.pole,B.guide.pole,e)};
      chainIK(W,'arm','L',g,ball,null);
    }
  }else if(t>=ANIM.tRel&&t<ANIM.tHide){const dt=t-ANIM.tRel;
    ball=ANIM.relPos.clone().add(new T.Vector3(BALL_V[0]*dt,BALL_V[1]*dt+.5*GRAV*dt*dt,BALL_V[2]*dt));spin=-16*dt;}
  else if(t>=ANIM.tIn){const dt=t-ANIM.T;
    ball=ANIM.catchPos.clone().add(new T.Vector3(BALL_VIN[0]*dt,BALL_VIN[1]*dt+.5*GRAV*dt*dt,BALL_VIN[2]*dt));spin=-9*dt;}
  const dm=new Float64Array(NB*16);
  for(let i=0;i<NB;i++)if(W[i])dmFromW(W,i).toArray(dm,i*16);
  const Mb=new T.Matrix4();
  if(ball)Mb.makeRotationFromEuler(BALL_BASE).premultiply(new T.Matrix4().makeRotationX(spin)).setPosition(ball);else Mb.makeTranslation(0,-50,0);
  Mb.toArray(dm,BI.ball*16);
  // 手指：两关键帧手型插值，再按这一帧球在手里的位置贴球
  const hands={};
  for(const [sd,s] of [['L',1],['R',-1]]){
    const hs=mixHand(A.hand[sd],B.hand[sd],e);let br=null;
    if(ball&&hs.grip>0){br=ball.clone().applyMatrix4(dmFromW(W,BI['hand'+sd]).invert()).toArray();br[0]/=BUILD.W;}
    hands[sd]=solveHand(s,hs,br);
  }
  return {dm,ballOn:!!ball,hands,ballPos:ball?ball.toArray():null};
}
/* ---------- Worker 池（失败就退回主线程逐帧算） ---------- */
const POOL=[],QUEUE=[];let POOL_OK=null,JOB_ID=1;
function makePool(){
  if(POOL_OK!==null)return POOL_OK;
  try{
    const three=new URL('../../vendor/three.min.r128.js',location.href).href;
    const core=new URL('../../src/lab/kobe-core.js',location.href).href;
    const src=`importScripts(${JSON.stringify(three)},${JSON.stringify(core)});\nself.onmessage=e=>{const r=workerJob(e.data);self.postMessage(r.msg,r.transfer);};`;
    const url=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));
    const n=clamp((navigator.hardwareConcurrency||4)-1,1,8);
    for(let i=0;i<n;i++){const w=new Worker(url);for(const D of DECS)w.postMessage({id:-1,decals:D,char:D.id});POOL.push({w,busy:false});}
    POOL_OK=true;
  }catch(e){console.warn('worker 不可用，改主线程烘焙',e);POOL_OK=false;}
  return POOL_OK;
}
function runJob(job,dead){return new Promise(res=>{QUEUE.push({job,res,dead});pump();});}
function pump(){
  while(QUEUE.length&&QUEUE[0].dead&&QUEUE[0].dead())QUEUE.shift().res(null);   // 已作废的烘焙直接丢掉
  if(!POOL_OK){ // 主线程退路：一帧一帧让出事件循环
    if(pump.busy||!QUEUE.length)return;pump.busy=true;
    setTimeout(()=>{const q=QUEUE.shift();const r=workerJob(q.job);pump.busy=false;q.res(r.msg.data);pump();},0);return;
  }
  for(const p of POOL){
    while(QUEUE.length&&QUEUE[0].dead&&QUEUE[0].dead())QUEUE.shift().res(null);
    if(p.busy||!QUEUE.length)continue;
    const q=QUEUE.shift();p.busy=true;
    p.w.onmessage=e=>{if(e.data.id!==q.job.id)return;p.busy=false;q.res(e.data.data);pump();};
    p.w.onerror=err=>{console.warn('worker 出错，改主线程',err);POOL_OK=false;p.busy=false;QUEUE.unshift(q);pump();};
    p.w.postMessage(q.job);
  }
}
/* 烘焙一整段 2.4s 动画。style：'vox'（B/E 体素，头部走头骨网格）或 'smooth'（D 平滑，头部细网格）。
   withBall=false 时球不进网格——球场里的球由投篮判定单独驱动，动画帧只记录"球在手里的位置"。 */
function bakeFrames(style,withBall,fps,onFrame,near){
  ensureKeys();
  const B={style,withBall,fps,N:Math.round(ANIM.T*fps),frames:null,ready:0,dead:false,t0:performance.now()};
  B.frames=new Array(B.N).fill(null);
  applyPose(POSES.hold);   // 头部网格只算一次（头骨局部空间，和姿势无关），每帧只换矩阵
  B.head=style==='vox'?geosFrom(voxelHead(.012)):buildSmooth(.0025,P=>P.bone===HB,DM[HB],headBounds());
  makePool();
  const order=[];for(let f=0;f<B.N;f++)order.push(f);
  const cur=Math.floor((near||0)*fps)%B.N;order.sort((a,b)=>((a-cur+B.N)%B.N)-((b-cur+B.N)%B.N)); // 先烘当前帧附近
  for(const f of order){
    const fp=animPose(f/fps);
    runJob({kind:style,id:JOB_ID++,dm:fp.dm,ballOn:withBall&&fp.ballOn,hands:fp.hands,opt:{...OPT},s:style==='vox'?.012:.0085},()=>B.dead).then(data=>{
      if(B.dead||!data)return;
      const headM=new T.Matrix4().fromArray(fp.dm,HB*16);let fr;
      if(style==='vox'){const body=geosFrom(data),std=new T.Group(),toon=new T.Group();
        std.add(vgroup(body,null,null),vgroup(B.head,null,headM));toon.add(vgroup(body,toonMat,null),vgroup(B.head,toonMat,headM));fr={std,toon,count:data.count};}
      else{const sm={body:smoothGeo(data),head:B.head,headM},pbr=new T.Group(),toon=new T.Group();
        smoothShow(pbr,sm,smoothMat,true);smoothShow(toon,sm,toonMat,false);fr={pbr,toon,count:data.tris};}
      fr.ball=fp.ballPos;B.frames[f]=fr;B.ready++;
      if(onFrame)onFrame(B,f);
    });
  }
  return B;
}
function setupAnim(){
  if(ST.mode!=='v12'&&ST.mode!=='hyb')ST.mode='hyb';
  const sig=ANIM.fps+'|'+OPT.sleeve+'|'+OPT.prop.k+'|'+OPT.char;
  ensureKeys();
  const {mn,mx}=ANIM.bounds,cx=(mn[0]+mx[0])/2,cz=(mn[2]+mx[2])/2;contact.position.set(cx,.001,cz);pixShadow.position.set(cx,.001,cz);contact.visible=true;
  if(!ANIM.bk||ANIM.sig!==sig){
    if(ANIM.bk)ANIM.bk.dead=true;ANIM.sig=sig;ANIM.shown=null;frame(ST.cam);
    setBusy(`烘焙动画 0/${Math.round(ANIM.T*ANIM.fps)} 帧`);
    ANIM.bk=bakeFrames('vox',true,ANIM.fps,(B)=>{
      setBusy(B.ready<B.N?`烘焙动画 ${B.ready}/${B.N} 帧`:null);
      if(B.ready===B.N)document.getElementById('stat').textContent=
        `动画 ${B.N} 帧 @${B.fps}fps · 每帧约 ${B.frames[0].count.toLocaleString()} 格 · 烘焙 ${((performance.now()-B.t0)/1000).toFixed(1)} s · ${POOL_OK?POOL.length+' 个 Worker':'主线程'}`;
      if(ST.pose==='anim'&&!CT.on)showAt(ANIM.t,true);
    },ANIM.t);
  }else showAt(ANIM.t,true);

}
function showAt(t,force){
  const B=ANIM.bk;if(!B)return;
  const f=Math.floor(t*B.fps+1e-6)%B.N;let fr=B.frames[f];
  if(!fr)for(let k=1;k<B.N&&!fr;k++)fr=B.frames[(f-k+B.N)%B.N];
  if(fr&&(fr!==ANIM.shown||force)){
    groups.v12.clear();hybGroup.clear();groups.v12.add(fr.std);hybGroup.add(fr.toon);ANIM.shown=fr;render();
  }
  const sc=document.getElementById('aScrub');if(document.activeElement!==sc)sc.value=t/ANIM.T;
  document.getElementById('animv').textContent=`${(t).toFixed(2)}s / 帧 ${f+1}/${B.N}`;
}
function tick(now){
  ANIM.raf=0;if(ST.pose!=='anim'||CT.on)return;
  const dt=ANIM.last?Math.min(.1,(now-ANIM.last)/1000):0;ANIM.last=now;
  if(ANIM.playing){ANIM.t=(ANIM.t+dt*ANIM.speed)%ANIM.T;showAt(ANIM.t);}
  ANIM.raf=requestAnimationFrame(tick);
}
function startAnim(){if(!ANIM.raf){ANIM.last=0;ANIM.raf=requestAnimationFrame(tick);}}
function stopAnim(){if(ANIM.raf)cancelAnimationFrame(ANIM.raf);ANIM.raf=0;}
function setBusy(txt){const b=document.getElementById('busy');if(txt){b.textContent=txt;document.body.classList.add('busy');}else document.body.classList.remove('busy');}

/* =====================================================================
   11. 球场：AIBA 蓄力投篮最小复刻（人物 + 篮筐 + 篮球，场地留空）
   规则从 AIBA 源码剥出来（src/data/game-config.js、src/config.js、src/gameplay/shots.js）：
     · 蓄力：按住时 power 以 DIFFS.fill %/s 增长（全明星 95），理想值 IDEAL=74，甜区半宽 DIFFS.zone（全明星 5.5）
     · 判定：|误差| ≤ zone·0.5 空心；> zone·1.8 不进；中间按概率 涮进 / 涮出 / 打板 / 弹框，
             欠蓄有一条"磕前框涮进"的救回路径（underSave）
     · 出手：飞行时间 0.78 + 距离·0.062；落点 = 篮筐中心 + 纵深偏移 + 横向偏移（按判定给，
             AIBA 的篮筐半径 .30，这里用真实 .2286，偏移按比例缩）
   角色：蓄力相位 power/IDEAL 驱动 持球→置球点→起跳，满值那一帧正好是出手帧；
         松手后动画实时播完 压腕→落地，下一记传球从正前方飞回手里。
   ===================================================================== */
const CT={on:qs.get('scene')==='court',style:qs.get('style')==='d'?'smooth':'hyb',cam:qs.get('ccam')||'over',diff:qs.get('diff')||'normal',
  state:'boot',t:ANIM.tIn,power:0,ball:null,score:0,made:0,shots:0,bk:{},raf:0,last:0,shown:null,wait:0,fps:20,toastT:0,net:1,lastErr:null};
const CT_DIFF={easy:{n:'新秀',zone:11,fill:80},normal:{n:'全明星',zone:5.5,fill:95},hard:{n:'名人堂',zone:3.2,fill:110}},CT_IDEAL=74;
const HOOP_C=new T.Vector3(0,3.05,7.4),RIM_R=.2286,BOARD_Z=HOOP_C.z+.38,BR=.121,RIM_K=RIM_R/.30;
const court={main:new T.Group(),pix:new T.Group(),nets:[],balls:[]};scene.add(court.main);pixScene.add(court.pix);court.main.visible=court.pix.visible=false;
function toonGeo(geo,hex,m){
  geo=geo.index?geo.toNonIndexed():geo;const n=geo.attributes.position.count,c=new T.Color(hex).convertSRGBToLinear(),col=new Float32Array(n*3);

  postMat.uniforms.tC.value=pixRT.texture;postMat.uniforms.tD.value=pixRT.depthTexture;postMat.uniforms.px.value.set(1/rw,1/rh);
  postMat.uniforms.cn.value=camera.near;postMat.uniforms.cf.value=camera.far;
  renderer.setViewport(x,H-y-h,w,h);renderer.setScissor(x,H-y-h,w,h);renderer.setScissorTest(true);
  renderer.render(postScene,postCam);renderer.toneMapping=tm;renderer.outputEncoding=oe;
}
function render(){
  {const mir=!LINEUP()&&ROSTER[OPT.char]&&ROSTER[OPT.char].mirror?-1:1;   // 左手球员（哈登）整身镜像，贴花已预翻
    for(const g of [groups.v20,groups.v12,groups.smooth,hybGroup,pixMesh])g.scale.x=mir;}
  const W=canvas.clientWidth,H=canvas.clientHeight;
  if(canvas.width!==Math.round(W*renderer.getPixelRatio())||canvas.height!==Math.round(H*renderer.getPixelRatio()))renderer.setSize(W,H,false);
  renderer.setScissorTest(false);renderer.clear();
  const labs=document.getElementById('labels');labs.innerHTML='';
  const lab=(txt,sub,x,y)=>{const d=document.createElement('div');d.className='lab';d.innerHTML=`${txt}<small>${sub}</small>`;d.style.left=x+'px';d.style.top=y+'px';labs.appendChild(d);};
  if(ST.mode==='all'){
    const narrow=W<900,cols=narrow?3:5,rows=narrow?2:1,cw=W/cols,ch=H/rows;
    const list=[['v20','A 体素','2cm'],['v12','B 体素','1.2cm'],['pix','C 像素化','3D→像素'],['smooth','D 平滑','参照'],['hyb','E 体素+卡渲','新']];
    list.forEach(([m,t,s],i)=>{const cx=(i%cols)*cw,cy=Math.floor(i/cols)*ch;drawCell(m,Math.round(cx),Math.round(cy),Math.round(cw),Math.round(ch));
      lab(t,s,cx+cw/2-44,cy+ch-40);});
  }else drawCell(ST.mode,0,0,W,H);
  if(LINEUP()&&PROPS_VIEW&&!CT.on)PROPS_VIEW.list.forEach((it,i)=>{   // 每人脚下标出头身数 / 名字
    const v=new T.Vector3(PROPS_VIEW.xs[i],-.05,(PROPS_VIEW.mn[2]+PROPS_VIEW.mx[2])/2).project(camera);
    lab(it.P.n,it.sub,(v.x*.5+.5)*W-60,(1-(v.y*.5+.5))*H+6);});
  renderer.setScissorTest(false);
}
let raf=0;const req=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;render();});};

/* ---------- UI ---------- */
function buttons(id,items,cur,on){const el=document.getElementById(id);[...el.querySelectorAll('button')].forEach(b=>b.remove());
  for(const [k,label] of items){const b=document.createElement('button');b.textContent=label;if(k===cur)b.className='on';b.onclick=()=>on(k);el.appendChild(b);}}
function refreshUI(){
  buttons('rScene',[['lab','实验室'],['court','▶ 球场蓄力投篮']],CT.on?'court':'lab',k=>{if(k==='court'&&!CT.on)enterCourt();else if(k==='lab'&&CT.on)exitCourt();});
  buttons('rStyle',[['smooth','D 平滑'],['hyb','E 体素卡渲']],CT.style,k=>{CT.style=k;ST.mode=k;CT.shown=null;ctBake(k);refreshUI();});
  buttons('rDiff',Object.entries(CT_DIFF).map(([k,v])=>[k,v.n]),CT.diff,k=>{CT.diff=k;refreshUI();});
  buttons('rCCam',[['over','越肩'],['side','转播侧面']],CT.cam,k=>{CT.cam=k;refreshUI();});
  if(CT.on){document.getElementById('note').textContent='从 AIBA 剥出来的蓄力投篮：按住蓄力、在甜区松手。判定规则、飞行时间、甜区宽度都和 AIBA 一致；角色动作由蓄力相位驱动，满值那一帧就是出手帧。';return;}
  buttons('rChar',ROSTER_IDS.map(id=>[id,SHORT[id]]),ST.mode==='roster'?'':OPT.char,k=>{OPT.char=k;ANIM.kd=null;
    if(CT.on){CT.shown=null;ctBake(CT.style);refreshUI();}else{if(ST.mode==='roster')ST.mode='hyb';rebuild(true);}});
  buttons('rMode',MODES,ST.mode,k=>{ST.mode=k;if(ST.pose==='anim'&&k!=='v12'&&k!=='hyb')ST.pose='set';rebuild(true);});
  buttons('rPose',[...Object.entries(POSES).map(([k,v])=>[k,v.name]),['anim','▶ 投篮动画']],ST.pose,k=>{ST.pose=k;rebuild(true);});
  const ra=document.getElementById('rAnim');ra.style.display=ST.pose==='anim'?'':'none';
  buttons('rAnim',[['play',ANIM.playing?'暂停':'播放'],['1','1×'],['.5','0.5×'],['.25','0.25×'],['f12','12fps'],['f24','24fps']],'',k=>{
    if(k==='play')ANIM.playing=!ANIM.playing;else if(k[0]==='f'){ANIM.fps=+k.slice(1);rebuild(false);}else ANIM.speed=+k;refreshUI();});
  const onSp={1:'1×',.5:'0.5×',.25:'0.25×'}[ANIM.speed];
  for(const b of ra.querySelectorAll('button'))if(b.textContent===onSp||b.textContent===ANIM.fps+'fps')b.className='on';
  ra.appendChild(document.getElementById('aScrub'));
  buttons('rCam',Object.entries(CAMS).map(([k,v])=>[k,v[0]]),ST.cam,k=>{ST.cam=k;frame(k);refreshUI();req();});
  buttons('rProp',PROPS.map(p=>[p.k,p.n]),OPT.prop.k,k=>{OPT.prop=propOf(k);ANIM.kd=null;
    if(CT.on){CT.shown=null;ctBake(CT.style);refreshUI();}else{if(ST.mode==='props')ST.mode='hyb';rebuild(true);}});
  buttons('rSleeve',[['black','黑'],['white','白'],['none','无']],OPT.sleeve,k=>{OPT.sleeve=k;rebuild(false);});
  document.getElementById('note').textContent=MODE_NOTE[ST.mode];
  document.getElementById('rPix').style.display=ST.mode==='pix'||ST.mode==='all'?'':'none';
  document.getElementById('pixv').textContent=ST.pix+' px/格';
}
function rebuild(reframe){
  setBusy('构建中…');refreshUI();
  setTimeout(()=>{setBusy(null);ensure();if(reframe&&ST.pose!=='anim')frame(ST.cam);refreshUI();req();},30);
}
document.getElementById('pix').value=ST.pix;
document.getElementById('aScrub').oninput=e=>{ANIM.playing=false;ANIM.t=+e.target.value*ANIM.T*.9999;showAt(ANIM.t);refreshUI();};
document.getElementById('pix').oninput=e=>{ST.pix=+e.target.value;refreshUI();req();};
document.getElementById('hide').onclick=()=>document.body.classList.toggle('nohud');
addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('nohud');if(e.code==='Space'&&CT.on){e.preventDefault();if(!e.repeat)ctCharge();}});
addEventListener('keyup',e=>{if(e.code==='Space'&&CT.on){e.preventDefault();ctRelease();}});
let drag=null;
canvas.addEventListener('pointerdown',e=>{if(CT.on){if(e.button===0)ctCharge();return;}drag={x:e.clientX,y:e.clientY,yaw:ST.yaw,pitch:ST.pitch};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;ST.yaw=drag.yaw-(e.clientX-drag.x)*.008;ST.pitch=clamp(drag.pitch+(e.clientY-drag.y)*.005,-.4,1.2);req();});
canvas.addEventListener('pointerup',()=>{drag=null;if(CT.on)ctRelease();});
canvas.addEventListener('wheel',e=>{e.preventDefault();ST.dist=clamp(ST.dist*Math.exp(e.deltaY*.001),.5,14);req();},{passive:false});
canvas.addEventListener('dblclick',()=>{frame(ST.cam);req();});
addEventListener('resize',req);
OPT.sleeve=qs.get('sleeve')||'black';OPT.char=ROSTER[qs.get('char')]?qs.get('char'):'kobe';OPT.prop=propOf(qs.get('prop')||'7');
if(qs.get('nohud'))document.body.classList.add('nohud');
if(CT.on){CT.on=false;enterCourt();}else{refreshUI();ensure();if(ST.pose!=='anim')frame(ST.cam);refreshUI();render();}
window.LAB={ST,OPT,POSES,ANIM,CT,ctCharge,ctRelease,ctTickManual(now){CT.raf=0;const on=CT.on;ctTick(now);if(CT.raf){cancelAnimationFrame(CT.raf);CT.raf=0;}},wp:(bn,p)=>new T.Vector3(...p).applyMatrix4(DM[BI[bn]]).toArray(),render,rebuild,frame,ensure,CACHE,seek(t){ANIM.playing=false;ANIM.t=t;showAt(t,true);},tune(pose,rot){Object.assign(POSES[pose].rot,rot);for(const k in CACHE)delete CACHE[k];ST.pose=pose;rebuild(true);}};
</script>
</body>
